<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Runner | TalentScope</title>

<script src="js/config.js?v=9"></script>
<script src="js/tab-switch-warning.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=7"></script>
<script src="js/session-helper.js?v=1"></script>
<script src="js/role-permissions.js?v=1"></script>
<script src="js/data-service.js?v=8"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f9fc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:70px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:18px;color:#0f172a;text-decoration:none}
.brand span{font-size:11px;font-weight:600;opacity:.6;margin-left:6px}
main{max-width:760px;margin:auto;padding:32px 20px 60px}
.hero{padding:30px 34px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0f4ccf,#2563eb 60%,#3b82f6);box-shadow:0 18px 40px rgba(37,99,235,.18);margin-bottom:22px}
.hero h1{margin:10px 0 6px;font-size:28px;letter-spacing:-.5px}
.hero p{margin:0;color:#dbeafe;font-size:13px}
.hero .pill{display:inline-block;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 6px 22px rgba(15,23,42,.04);margin-bottom:18px}
.card h2{margin:0 0 6px;font-size:20px}
.card .muted{color:#64748b;font-size:13px;line-height:1.6;margin:0}
.list{margin-top:18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #e2e8f0}
.item:last-child{border-bottom:0}
.item-info strong{font-size:14px;display:block}
.item-info small{color:#64748b;font-size:11px}
.badge{padding:5px 11px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.badge.not-started{background:#f1f5f9;color:#475569}
.badge.in-progress{background:#fef3c7;color:#92400e}
.badge.completed{background:#dcfce7;color:#166534}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.btn.primary{background:#2563eb;color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.secondary{background:#fff;border:1px solid #e2e8f0;color:#334155}
.btn:disabled{opacity:.4;cursor:not-allowed}
.state{padding:36px;border-radius:18px;background:#fff;border:1px solid #e2e8f0;text-align:center;color:#64748b;font-size:13px}
.state.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.state.success{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.state .icon{font-size:40px;margin-bottom:12px}
.state h3{margin:0 0 8px;color:inherit;font-size:18px}
.hidden{display:none!important}
</style>
<link rel="stylesheet" href="css/sidebar-shared.css?v=7">
</head>
<body>
<header>
  <a class="brand" href="participant-dashboard.html">TalentScope<span>Assessment Runner</span></a>
</header>

<main>
  <section id="loading" class="state">Memuat data assessment...</section>

  <section id="error" class="state error hidden">
    <div class="icon">⚠</div>
    <h3 id="errorTitle">Terjadi kesalahan</h3>
    <p id="errorMsg" style="margin:0"></p>
  </section>

  <section id="content" class="hidden">
    <div class="hero">
      <span class="pill">Assessment Portal</span>
      <h1 id="participantName">-</h1>
      <p id="projectName">-</p>
    </div>

    <div class="card">
      <h2>Daftar Assessment</h2>
      <p class="muted">Kerjakan seluruh assessment secara berurutan. Assessment yang sedang dikerjakan akan dilanjutkan otomatis.</p>
      <div id="assessmentList" class="list"></div>
    </div>

    <div class="actions">
      <button id="viewResultsBtn" class="btn secondary">Lihat Hasil Saya</button>
      <button id="startBtn" class="btn primary" disabled>Mulai Assessment</button>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";

// =========================================================
// HELPERS
// =========================================================
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const projectId = String(params.get("project") || params.get("projectId") || "").trim();
const participantId = String(params.get("participant") || params.get("participantId") || "").trim();
const accessCode = String(params.get("code") || "").trim();

// =========================================================
// CODE DETECTION — dari nama assessment
// =========================================================
function detectCodeFromName(name) {
  const n = String(name || "").toLowerCase();
  if (n.includes("vap") || n.includes("work performance") || n.includes("sustained")) return "VAP";
  if (n.includes("tpdk") || n.includes("penalaran")) return "TPDK";
  if (n.includes("disc")) return "DISC";
  if (n.includes("papi") || n.includes("kostick")) return "PAPI";
  if (n.includes("leadership") || n.includes("lsjt")) return "LSJT";
  if (n.includes("managerial") || n.includes("msjt")) return "MSJT";
  if (n.includes("intray") || n.includes("inbasket") || n.includes("inbaket") || n.includes("in-basket")) return "INTRAY";
  return "";
}

// =========================================================
// ROUTE RESOLVER — code → file HTML assessment
// =========================================================
function resolveRoute(code) {
  const c = String(code || "").toUpperCase();
  switch (c) {
    case "VAP":     return "speedtest.html";
    case "TPDK":    return "tpdk_test.html";
    case "DISC":    return "disc_test.html";
    case "PAPI":    return "papi_kostick_test.html";
    case "LSJT":    return "sjt_leadership.html";
    case "MSJT":    return "msjt_managerial.html";
    case "INTRAY":  return "intray_test.html";
    default:        return "";
  }
}

// =========================================================
// STATUS NORMALIZATION — DB pakai "Not Started" dll
// =========================================================
function normalizeStatus(s) {
  const v = String(s || "").trim().toLowerCase();
  if (v === "completed") return "Completed";
  if (v === "in progress") return "In Progress";
  if (v === "not started" || v === "") return "Not Started";
  return "Not Started";
}

// =========================================================
// RENDER ERROR
// =========================================================
function showError(title, msg) {
  $("loading").classList.add("hidden");
  $("content").classList.add("hidden");
  $("error").classList.remove("hidden");
  $("errorTitle").textContent = title;
  $("errorMsg").textContent = msg || "";
}

// =========================================================
// MAIN
// =========================================================
async function init() {
  if (!projectId || !participantId) {
    showError("URL tidak lengkap", "Project ID dan Participant ID wajib ada di URL.");
    return;
  }

  const sb = window.supabaseClient || window.supabase;
  if (!sb || typeof sb.from !== "function") {
    showError("Sistem tidak siap", "Supabase client tidak tersedia. Coba refresh halaman.");
    return;
  }

  // ---- 1. Verify participant & ownership ----
  const { data: participant, error: pErr } = await sb
    .from("participants")
    .select("id, project_id, name, full_name, access_code")
    .eq("id", participantId)
    .eq("project_id", projectId)
    .maybeSingle();

  if (pErr || !participant) {
    showError("Access Denied", "Peserta tidak ditemukan di project ini.");
    return;
  }

  // Optional: verify access code (kalau URL punya `code=`)
  if (accessCode && participant.access_code && accessCode !== participant.access_code) {
    showError("Access Denied", "Kode akses tidak valid.");
    return;
  }

  // ---- 2. Ambil project info ----
  const { data: project } = await sb
    .from("projects")
    .select("id, name, project_name")
    .eq("id", projectId)
    .maybeSingle();

  // ---- 3. Ambil daftar assessment dari participant_assessments ----
  const { data: paRows, error: paErr } = await sb
    .from("participant_assessments")
    .select("id, assessment_id, assessment_name, status, started_at, completed_at, created_at")
    .eq("participant_id", participantId)
    .eq("project_id", projectId)
    .order("created_at", { ascending: true });

  if (paErr) {
    showError("Gagal memuat assessment", "Terjadi kesalahan saat mengambil data assessment.");
    return;
  }

  const assessments = Array.isArray(paRows) ? paRows : [];

  if (assessments.length === 0) {
    showError("Belum ada assessment", "Anda belum memiliki assessment yang ditugaskan. Hubungi administrator project.");
    return;
  }

  // ---- 4. Tentukan next assessment ----
  // Prioritas: cari "In Progress" dulu, lalu "Not Started"
  let nextIndex = -1;
  for (let i = 0; i < assessments.length; i++) {
    const s = normalizeStatus(assessments[i].status);
    if (s === "In Progress") { nextIndex = i; break; }
  }
  if (nextIndex === -1) {
    for (let i = 0; i < assessments.length; i++) {
      const s = normalizeStatus(assessments[i].status);
      if (s === "Not Started") { nextIndex = i; break; }
    }
  }

  const allCompleted = assessments.every(a => normalizeStatus(a.status) === "Completed");

  // ---- 5. Render UI ----
  $("participantName").textContent = participant.name || participant.full_name || "Peserta";
  $("projectName").textContent = project?.name || project?.project_name || "Assessment Project";

  $("assessmentList").innerHTML = assessments.map((a, i) => {
    const s = normalizeStatus(a.status);
    const cls = s === "Completed" ? "completed" : s === "In Progress" ? "in-progress" : "not-started";
    return `<div class="item">
      <div class="item-info">
        <strong>${escapeHtml(a.assessment_name || "Assessment " + (i+1))}</strong>
        <small>Assessment ${i+1} dari ${assessments.length}</small>
      </div>
      <span class="badge ${cls}">${s}</span>
    </div>`;
  }).join("");

  const startBtn = $("startBtn");
  const viewResultsBtn = $("viewResultsBtn");

  if (allCompleted) {
    startBtn.disabled = true;
    startBtn.textContent = "Semua Selesai";
  } else if (nextIndex === -1) {
    startBtn.disabled = true;
    startBtn.textContent = "Tidak ada tes berikutnya";
  } else {
    startBtn.disabled = false;
    const s = normalizeStatus(assessments[nextIndex].status);
    startBtn.textContent = s === "In Progress" ? "Lanjutkan Assessment" : "Mulai Assessment";
  }

  // Sembunyikan "Lihat Hasil" kalau belum ada yang Completed
  const hasAnyCompleted = assessments.some(a => normalizeStatus(a.status) === "Completed");
  if (!hasAnyCompleted) {
    viewResultsBtn.classList.add("hidden");
  }

  // ---- 6. Event handlers ----
  startBtn.onclick = function () {
    if (nextIndex === -1) return;
    const a = assessments[nextIndex];
    const code = detectCodeFromName(a.assessment_name);
    const route = resolveRoute(code);
    if (!route) {
      alert("Assessment \"" + a.assessment_name + "\" belum memiliki runner. Hubungi administrator.");
      return;
    }
    const qs = new URLSearchParams({
      projectId: projectId,
      participantId: participantId,
      assessmentIndex: String(nextIndex),
      assessmentCode: code,
      assessmentName: a.assessment_name || code,
    });
    location.href = route + "?" + qs.toString();
  };

  viewResultsBtn.onclick = function () {
    const qs = new URLSearchParams({
      projectId: projectId,
      participantId: participantId,
    });
    location.href = "participant-result.html?" + qs.toString();
  };

  // ---- 7. Show ----
  $("loading").classList.add("hidden");
  $("content").classList.remove("hidden");
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

init().catch(err => {
  console.error("[RUNNER] Unhandled error:", err);
  showError("Terjadi kesalahan", String(err && err.message || err));
});

})();
</script>
</body>
</html>

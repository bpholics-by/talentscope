<!DOCTYPE html>
<html lang="id">
<head>

<style>
*{box-sizing:border-box}
:root{--teal:#0891b2;--teal-dark:#0e7490;--line:#e2e8f0}
body{margin:0;background:#f4f7fb;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:18px}
header small{color:#64748b;display:block;font-size:11px;margin-top:2px}
.wrap{max-width:1200px;margin:auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 4px 14px #0f172a06}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
select,input,button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff;font-size:13px}
button{background:var(--teal);color:#fff;border:0;font-weight:800;cursor:pointer;transition:.15s}
button:hover{background:var(--teal-dark)}
button.ghost{background:#f1f5f9;color:#334155}
button.ghost:hover{background:#e2e8f0}
button.danger{background:#dc2626}
button.danger:hover{background:#b91c1c}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select{min-width:320px;flex:1}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.badge-source{background:#cffafe;color:#155e75}
.badge-local{background:#f1f5f9;color:#475569}
.hero{background:linear-gradient(135deg,#0c4a6e 0%,#0891b2 60%,#06b6d4 100%);color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff15;border-radius:50%;right:-80px;top:-100px}
.hero:after{content:"";position:absolute;width:400px;height:400px;border:1px solid #ffffff10;border-radius:50%;right:-150px;bottom:-250px}
.hero-label{font-size:10px;font-weight:900;letter-spacing:2px;color:#a5f3fc;margin-bottom:10px;position:relative;z-index:1}
.hero-title{font-size:30px;font-weight:900;margin:0 0 6px;position:relative;z-index:1}
.hero-sub{color:#cffafe;font-size:13px;position:relative;z-index:1;margin:0}
.overall-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;position:relative;z-index:1}
.overall-stat{background:#ffffff12;border:1px solid #ffffff20;border-radius:12px;padding:14px 16px}
.overall-stat .lbl{font-size:10px;font-weight:800;letter-spacing:.7px;color:#a5f3fc;text-transform:uppercase}
.overall-stat .val{font-size:24px;font-weight:900;margin-top:6px;color:#fff;font-variant-numeric:tabular-nums}
.overall-stat .unit{font-size:12px;color:#cffafe;font-weight:600;margin-left:4px}
.comp-block{padding:18px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:12px;transition:.15s}
.comp-block:hover{border-color:#a5f3fc}
.comp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.comp-name{font-size:15px;font-weight:900;color:#0f172a}
.comp-label{font-size:11px;color:#64748b;margin-top:3px;font-weight:600}
.comp-score-wrap{text-align:right;flex-shrink:0}
.comp-score{font-size:26px;font-weight:900;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1}
.comp-badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;margin-top:6px}
.b-excellent{background:#059669;color:#ffffff}
.b-good{background:#dcfce7;color:#166534}
.b-adequate{background:#dbeafe;color:#1e40af}
.b-poor{background:#fef3c7;color:#92400e}
.b-critical{background:#fee2e2;color:#991b1b}
.comp-bar{height:16px;background:#e2e8f0;border-radius:99px;overflow:hidden;position:relative;margin-bottom:6px}
.comp-bar i{display:block;height:100%;transition:width .8s}
.comp-detail{display:flex;justify-content:space-between;font-size:11px;color:#64748b;font-weight:700;margin-top:8px;gap:10px;flex-wrap:wrap}
.comp-detail b{color:#0f172a;font-size:12px}
.insight{background:#ecfeff;border-left:4px solid var(--teal);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.75;margin-top:12px;color:#155e75}
.insight b{color:#0e7490}
.warning{background:#fef3c7;border-left:4px solid #d97706;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.7;margin-top:12px;color:#78350f}
.warning b{color:#92400e}
.success-box{background:#f0fdf4;border-left:4px solid #16a34a;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.7;margin-top:12px;color:#166534}
.success-box b{color:#166534}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#f8fafc;color:#64748b;font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
tr:hover td{background:#f8fafc}
.empty{text-align:center;color:#94a3b8;padding:60px 20px}
.empty h3{color:#64748b;margin:0 0 8px}
.chart-container{position:relative;height:360px}
.disclaimer{margin-top:18px;padding:16px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;font-size:12px;line-height:1.7;color:#78350f}
.disclaimer b{color:#92400e}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800}
.p-strong{background:#cffafe;color:#155e75}
.p-low{background:#fef3c7;color:#92400e}
.section-title{font-size:18px;font-weight:900;margin:0 0 4px;color:#0f172a}
.section-sub{font-size:12px;color:#64748b;margin:0 0 16px}
.level-legend{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:20px;font-size:11px;align-items:center}
.level-legend strong{color:#0f172a;font-weight:800;margin-right:6px}
.level-legend-item{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-weight:700}

</style>
</head>
<body>

<header>
  <div>
    <h1>📊 MSJT Report</h1>
    <small>Managerial Situational Judgment Test — Admin Dashboard</small>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="sourceBadge" class="badge badge-local">📦 LocalStorage</span>
    <button class="ghost" onclick="refreshList()">🔄 Refresh</button>
    <button class="ghost" onclick="exportAll()">⬇ Export Semua</button>
    <button class="danger" onclick="clearAll()">🗑 Hapus Semua</button>
  </div>
</header>

<div class="wrap">
  <div class="card" style="padding:16px">
    <div class="toolbar">
      <select id="resultSelect" onchange="loadResult()"><option value="">— Pilih peserta —</option></select>
      <input id="searchInput" placeholder="🔍 Cari nama / ID / project..." oninput="filterList()" style="min-width:240px">
      <button onclick="exportCurrent()">⬇ Export Hasil Ini</button>
    </div>
  </div>
  <div id="reportContainer"><div class="card empty"><h3>Belum ada hasil dipilih</h3><p>Pilih peserta dari dropdown di atas.</p></div></div>
</div>

<script>
/* =========================================================
   MSJT REPORT VIEWER — v3
   5-Level Classification + Narrative Interpretation
========================================================= */
function initReport() {

    /* Cek dependencies */
    if (typeof Chart === "undefined") {
        console.error("[Report] Chart.js belum siap — retry 500ms");
        setTimeout(initReport, 500);
        return;
    }

    if (typeof window.supabaseClient === "undefined" && typeof window.supabase === "undefined") {
        console.error("[Report] Supabase belum siap — retry 500ms");
        setTimeout(initReport, 500);
        return;
    }

    console.log("[Report] Dependencies siap — mulai init");

let allResults = [];
let filteredResults = [];
let currentResult = null;
let charts = {};
let dataSource = "local";
const SUPABASE_TABLE = "sjt_results";

function el(id){ return document.getElementById(id); }
function fmtDate(iso){
  if(!iso) return "-";
  try { return new Date(iso).toLocaleString("id-ID", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}); }
  catch(e) { return iso; }
}

async function loadFromSupabase(){
  try {
    let sb = window.supabaseClient || window.supabase || null;
    if (!sb) return null;
    const { data, error } = await sb.from(SUPABASE_TABLE).select("*")
      .eq("result_type", "MSJT").order("submitted_at", { ascending: false }).limit(500);
    if (error) { console.warn("[MSJT Report] error:", error.message); return null; }
    if (!Array.isArray(data) || data.length === 0) return null;
    return data.map(row => ({
      version: row.version || 1,
      resultType: "MSJT",
      projectId: row.project_id,
      participantId: row.participant_id,
      assessmentIndex: row.assessment_index,
      assessmentCode: row.assessment_code,
      assessmentName: row.assessment_name,
      participantName: row.participant_name || "",
      responses: typeof row.responses === "string" ? JSON.parse(row.responses) : row.responses,
      scores: typeof row.scores === "string" ? JSON.parse(row.scores) : row.scores,
      totalItems: row.total_items,
      answeredItems: row.answered_items,
      submittedAt: row.submitted_at,
      _source: "supabase"
    }));
  } catch(e) { console.warn("[MSJT Report] Gagal load:", e); return null; }
}

function loadFromLocal(){
  try {
    return JSON.parse(localStorage.getItem("talent_scope_results") || "[]")
      .filter(x => x.resultType === "MSJT")
      .map(r => ({ ...r, _source: "local" }));
  } catch(e) { return []; }
}

async function refreshList(){
  try {
    let results = await loadFromSupabase();
    if (results && results.length > 0) {
      allResults = results;
      dataSource = "supabase";
      el("sourceBadge").textContent = "☁ Supabase";
      el("sourceBadge").className = "badge badge-source";
    } else {
      allResults = loadFromLocal();
      dataSource = "local";
      el("sourceBadge").textContent = "📦 LocalStorage";
      el("sourceBadge").className = "badge badge-local";
    }
    allResults.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
    filteredResults = [...allResults];
    renderDropdown();
    autoSelectFromUrl();
    if (allResults.length === 0) {
      el("reportContainer").innerHTML = `<div class="card empty"><h3>Belum ada hasil MSJT</h3></div>`;
    } else {
      el("reportContainer").innerHTML = `<div class="card empty"><h3>📋 ${allResults.length} hasil tersedia</h3><p>Pilih peserta dari dropdown.</p></div>`;
    }
  } catch (err) {
    console.error("[MSJT Report] Error:", err);
    el("reportContainer").innerHTML = `<div class="card empty"><h3>⚠ Gagal memuat</h3><p>${err.message}</p></div>`;
  }
}

function renderDropdown(){
  const sel = el("resultSelect");
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">— Pilih peserta (' + filteredResults.length + ') —</option>';
  filteredResults.forEach((r) => {
    const opt = document.createElement("option");
    opt.value = allResults.indexOf(r);
    const name = r.participantName || r.participantId || "Unknown";
    opt.textContent = `${name} • ${r.assessmentName || "MSJT"} • ${fmtDate(r.submittedAt)}`;
    sel.appendChild(opt);
  });
  if (currentVal) sel.value = currentVal;
}

function filterList(){
  const q = el("searchInput").value.toLowerCase().trim();
  if (!q) filteredResults = [...allResults];
  else {
    filteredResults = allResults.filter(r =>
      String(r.participantId || "").toLowerCase().includes(q) ||
      String(r.participantName || "").toLowerCase().includes(q) ||
      String(r.projectId || "").toLowerCase().includes(q)
    );
  }
  renderDropdown();
}

function loadResult(){
  const idx = el("resultSelect").value;
  if (idx === "") {
    el("reportContainer").innerHTML = `<div class="card empty">Pilih peserta.</div>`;
    currentResult = null;
    return;
  }
  currentResult = allResults[Number(idx)];
  renderReport(currentResult);
}

function autoSelectFromUrl(){
  var params = new URLSearchParams(window.location.search);
  var targetParticipantId = params.get("participantId");
  var targetProjectId = params.get("projectId");
  if (!targetParticipantId) return;

  var index = -1;
  for (var i = 0; i < allResults.length; i++) {
    var r = allResults[i];
    if (String(r.participantId) === String(targetParticipantId) &&
        (!targetProjectId || String(r.projectId) === String(targetProjectId))) {
      index = i; break;
    }
  }
  if (index === -1) return;

  var select = document.getElementById("resultSelect");
  if (select) {
    select.value = String(index);
    setTimeout(function() { if (typeof loadResult === "function") loadResult(); }, 150);
  }
}

/* =========================================================
   5-LEVEL CLASSIFICATION
========================================================= */
function clsNormalized(v){
  if (v >= 85) return "Baik Sekali";
  if (v >= 70) return "Baik";
  if (v >= 55) return "Cukup";
  if (v >= 40) return "Kurang";
  return "Sangat Kurang";
}
function clsClass(v){
  if (v >= 85) return "b-excellent";
  if (v >= 70) return "b-good";
  if (v >= 55) return "b-adequate";
  if (v >= 40) return "b-poor";
  return "b-critical";
}
function getBarColor(v){
  if (v >= 85) return "linear-gradient(90deg,#059669,#10b981)";
  if (v >= 70) return "linear-gradient(90deg,#16a34a,#22c55e)";
  if (v >= 55) return "linear-gradient(90deg,#0891b2,#06b6d4)";
  if (v >= 40) return "linear-gradient(90deg,#d97706,#f59e0b)";
  return "linear-gradient(90deg,#dc2626,#ef4444)";
}

/* =========================================================
   RENDER REPORT
========================================================= */
function renderReport(r){
  const scores = r.scores || {};
  const compKeys = Object.keys(scores);
  const sorted = compKeys.map(k => ({ key: k, ...scores[k] }))
    .sort((a, b) => b.normalized - a.normalized);

  const dominant = sorted[0];
  const weakest = sorted[sorted.length - 1];

  const compHTML = sorted.map(comp => {
    const barColor = getBarColor(comp.normalized);
    return `
      <div class="comp-block">
        <div class="comp-head">
          <div>
            <div class="comp-name">${comp.label}</div>
            <div class="comp-label">Net Score: ${comp.netScore > 0 ? '+' : ''}${comp.netScore.toFixed(1)}</div>
          </div>
          <div class="comp-score-wrap">
            <div class="comp-score">${comp.normalized.toFixed(1)}</div>
            <span class="comp-badge ${clsClass(comp.normalized)}">${clsNormalized(comp.normalized)}</span>
          </div>
        </div>
        <div class="comp-bar"><i style="width:${Math.max(0, Math.min(100, comp.normalized))}%;background:${barColor}"></i></div>
        <div class="comp-detail">
          <span>MOST: <b>${comp.most}</b> (${comp.mostPct.toFixed(1)}%)</span>
          <span>LEAST: <b>${comp.least}</b> (${comp.leastPct.toFixed(1)}%)</span>
          <span>Net: <b>${comp.netScore > 0 ? '+' : ''}${comp.netScore.toFixed(1)}</b></span>
        </div>

  }).join("");

  const interpretationHTML = buildInterpretation(scores, sorted);

        <span class="level-legend-item b-adequate">Cukup (55-69)</span>
        <span class="level-legend-item b-poor">Kurang (40-54)</span>
        <span class="level-legend-item b-critical">Sangat Kurang (&lt;40)</span>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">📌 Profil 8 Kompetensi Manajerial</h3>
      <p class="section-sub">Profil kompetensi berdasarkan 32 item MSJT. Skor bersifat <b>ipsatif</b> — total skor setiap individu selalu sama. Interpretasi dilakukan dengan membandingkan antar-kompetensi.</p>
      ${compHTML}
    </div>

    <div class="card">
      <h3 class="section-title">🕸 Radar 8 Kompetensi</h3>

/* =========================================================
   INTERPRETASI NARATIF — TANPA ANGKA
========================================================= */
function buildInterpretation(scores, sorted){
  const dominant = sorted[0];
  const weakest = sorted[sorted.length - 1];

  const sortedArr = sorted;
  const top3 = sortedArr.slice(0, 3);
  const bottom3 = sortedArr.slice(-3).reverse();

  const strengthsHTML = top3.map(c => `<li><b>${c.label}</b> — ${NARRATIVE_DYNAMIC[c.key] || ""}</li>`).join("");
  const weaksHTML = bottom3.map(c => `<li><b>${c.label}</b> — ${NARRATIVE_WEAK[c.key] || ""}</li>`).join("");

  return `
    <div class="insight">
      <b>Profil Dominan: ${dominant.label}</b>
      <p style="margin:8px 0 0;font-size:13px;line-height:1.75">
        ${NARRATIVE_STRENGTH[dominant.key] || ""}
        Kompetensi ini tampil paling menonjol pada profil kandidat, menjadi kekuatan utama yang dapat diandalkan dalam peran manajerial.
      </p>
    </div>

    <div class="warning">
      <b>Area Pengembangan: ${weakest.label}</b>
      <p style="margin:8px 0 0;font-size:13px;line-height:1.75">
        ${NARRATIVE_WEAK[weakest.key] || ""}
      </p>
    </div>

    <div class="grid-2" style="margin-top:16px">
      <div class="success-box">
        <b>✓ 3 Kompetensi Terkuat</b>
        <ul style="margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.9">${strengthsHTML}</ul>
      </div>
      <div class="warning">
        <b>⚠ 3 Kompetensi Terlemah</b>
        <ul style="margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.9">${weaksHTML}</ul>
      </div>
    </div>

    <div class="insight" style="margin-top:16px;background:#f0fdfa;border-left-color:#0d9488">
      <b>💡 Rekomendasi Pengembangan</b>
      <ul style="margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.9">
        <li>Fokuskan pengembangan pada <b>${weakest.label}</b> melalui pelatihan terarah, mentoring, atau penugasan khusus.</li>
        <li>Manfaatkan kekuatan <b>${dominant.label}</b> sebagai leverage untuk mengangkat area lain.</li>
        <li>Bandingkan hasil ini dengan asesmen lain (VAP, PAPI, DISC) untuk konvergensi bukti.</li>
        <li>Untuk keputusan seleksi/promosi, gunakan <b>multiple hurdle</b> — jangan jadikan MSJT sebagai satu-satunya dasar.</li>
      </ul>
    </div>
  `;
}

/* =========================================================
   RADAR CHART
========================================================= */
function renderRadar(scores, sorted){
  if (charts.radar) charts.radar.destroy();
  const ctx = el("radarChart");
  if (!ctx) return;

  const labels = ["Planning & Organizing","Strategic Thinking","Decision Making","Cost & Efficiency","Controlling","Conflict Resolution","People Management","Business Acumen"];
  const keyOrder = ["PO", "ST", "DM", "CB", "CTL", "CR", "PM", "BA"];
  const dataValues = keyOrder.map(k => {
    const c = scores[k];
    return c ? Math.max(0, Math.min(100, c.normalized)) : 0;
  });

  charts.radar = new Chart(ctx, {
    type: "radar",
    data: {
      labels: labels,
      datasets: [
        { label: "Profil Kandidat", data: dataValues, borderColor: "#0891b2", backgroundColor: "rgba(8,145,178,.18)", pointBackgroundColor: "#0891b2", pointBorderColor: "#fff", pointBorderWidth: 2, pointRadius: 6 },
        { label: "Benchmark 50", data: [50,50,50,50,50,50,50,50], borderColor: "#94a3b8", backgroundColor: "rgba(148,163,184,.08)", borderDash: [4,4], pointRadius: 0 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { font: { size: 11 }, padding: 14 } } }, scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 25, font: { size: 10 }, backdropColor: "rgba(255,255,255,.7)" }, pointLabels: { font: { size: 11, weight: "600" }, color: "#334155" }, grid: { color: "#e2e8f0" }, angleLines: { color: "#e2e8f0" } } } }
  });
}

/* =========================================================
   EXPORT
========================================================= */
function exportCurrent(){
  if (!currentResult) return alert("Pilih hasil dulu.");
  const blob = new Blob([JSON.stringify(currentResult, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `MSJT_${currentResult.participantId}_${currentResult.assessmentIndex}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function exportAll(){
  if (!allResults.length) return alert("Belum ada data.");
  const blob = new Blob([JSON.stringify(allResults, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `MSJT_all_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function clearAll(){
  if (!confirm("Hapus SEMUA hasil MSJT dari localStorage? (Supabase TIDAK terhapus)")) return;
  const kept = JSON.parse(localStorage.getItem("talent_scope_results") || "[]").filter(x => x.resultType !== "MSJT");
  localStorage.setItem("talent_scope_results", JSON.stringify(kept));
  refreshList();
}

       /* ==========================================================

<!-- ==========================================================
     PATCH: Embed Mode — Sembunyikan Header & Toolbar
     ----------------------------------------------------------
     Kalau URL punya ?embed=1 (dibuka dari combined-result.html),
     sembunyikan header & toolbar supaya tampilan bersih.
========================================================== -->
<script>
(function () {
    "use strict";
    var params = new URLSearchParams(window.location.search);
    if (params.get("embed") === "1") {
        console.log("[Embed Mode] Menyembunyikan header & toolbar");
        
        // Sembunyikan header
        document.querySelectorAll("header").forEach(function (el) {
            el.style.display = "none";
        });
        
        // Sembunyikan card toolbar (dropdown + search + button)
        document.querySelectorAll(".card").forEach(function (card) {
            // Cek apakah card ini berisi toolbar
            if (card.querySelector("#resultSelect") || 
                card.querySelector("#searchInput")) {
                card.style.display = "none";
            }
        });
        
        // Alternatif: sembunyikan elemen spesifik
        var resultSelect = document.getElementById("resultSelect");
        if (resultSelect) {
            var toolbarCard = resultSelect.closest(".card");
            if (toolbarCard) toolbarCard.style.display = "none";
        }
        
        // Sembunyikan tombol Refresh / Export / Hapus di header (jika masih kelihatan)
        document.querySelectorAll(".badge-source, .badge-local").forEach(function (el) {
            el.style.display = "none";
        });
        
        // Sesuaikan padding wrap
        var wrap = document.querySelector(".wrap");
        if (wrap) {
            wrap.style.paddingTop = "0px";
        }
    }
})();
</script>

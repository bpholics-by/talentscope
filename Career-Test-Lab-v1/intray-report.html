<style>
*{box-sizing:border-box}
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:18px}
header small{color:#64748b;display:block;font-size:11px;margin-top:2px}
.wrap{max-width:1200px;margin:auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 4px 14px #0f172a06}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
select,input,button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff;font-size:13px}
button{background:#2563eb;color:#fff;border:0;font-weight:800;cursor:pointer;transition:.15s}
button:hover{background:#1d4ed8}
button.ghost{background:#f1f5f9;color:#334155}
button.danger{background:#dc2626}
button:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select{min-width:320px;flex:1}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.badge-source{background:#e0e7ff;color:#3730a3}
.badge-local{background:#f1f5f9;color:#475569}

.hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 60%,#0891b2 100%);color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff15;border-radius:50%;right:-80px;top:-100px}
.hero-label{font-size:10px;font-weight:900;letter-spacing:2px;color:#93c5fd;margin-bottom:10px;position:relative;z-index:1}
.hero-title{font-size:30px;font-weight:900;margin:0 0 6px;position:relative;z-index:1}
.hero-sub{color:#cbd5e1;font-size:13px;position:relative;z-index:1;margin:0}
.overall-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;position:relative;z-index:1}
.overall-stat{background:#ffffff12;border:1px solid #ffffff20;border-radius:12px;padding:14px 16px}
.overall-stat .lbl{font-size:10px;font-weight:800;letter-spacing:.7px;color:#93c5fd;text-transform:uppercase}
.overall-stat .val{font-size:26px;font-weight:900;margin-top:6px;color:#fff;font-variant-numeric:tabular-nums}
.overall-stat .unit{font-size:12px;color:#cbd5e1;font-weight:600;margin-left:4px}

.dim-block{padding:16px 0;border-bottom:1px solid var(--line)}
.dim-block:last-child{border-bottom:0}
.dim-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}
.dim-name{font-size:15px;font-weight:850;color:#0f172a}
.dim-cat{font-size:11px;color:#64748b;margin-top:3px;font-weight:600}
.dim-score-wrap{text-align:right;flex-shrink:0}
.dim-score{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.dim-badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;margin-top:6px}
.dim-bar-track{height:14px;background:#e2e8f0;border-radius:99px;position:relative;overflow:visible;margin-top:14px;margin-bottom:8px}
.dim-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#0891b2);transition:width .8s ease}
.dim-bar-marker{position:absolute;top:-6px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.dim-bar-marker:after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#0f172a}
.dim-bar-scale{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;font-weight:600;margin-top:6px}

.hex-badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;font-size:18px;font-weight:900;flex-shrink:0;color:#fff}
.hex-badge.sangat-baik{background:linear-gradient(135deg,#16a34a,#22c55e)}
.hex-badge.baik{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.hex-badge.cukup{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}
.hex-badge.kurang{background:linear-gradient(135deg,#d97706,#f59e0b)}
.hex-badge.sangat-kurang{background:linear-gradient(135deg,#dc2626,#ef4444)}

.b-sangat-baik{background:#dcfce7;color:#166534}
.b-baik{background:#dbeafe;color:#1e40af}
.b-cukup{background:#ede9fe;color:#5b21b6}
.b-kurang{background:#fef3c7;color:#92400e}
.b-sangat-kurang{background:#fee2e2;color:#991b1b}

.section-title{font-size:18px;font-weight:900;margin:0 0 4px;color:#0f172a}
.section-sub{font-size:12px;color:#64748b;margin:0 0 16px}
.empty{text-align:center;color:#94a3b8;padding:60px 20px}
.empty h3{color:#64748b;margin:0 0 8px}
.chart-container{position:relative;height:300px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#f8fafc;color:#64748b;font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
tr:hover td{background:#f8fafc}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800}
.p-high{background:#fee2e2;color:#991b1b}
.p-med{background:#fef3c7;color:#92400e}
.p-low{background:#dcfce7;color:#166534}
.p-correct{background:#dcfce7;color:#166534}
.p-wrong{background:#fee2e2;color:#991b1b}

.disclaimer{margin-top:18px;padding:16px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;font-size:12px;line-height:1.7;color:#78350f}
.disclaimer b{color:#92400e}

.cta-summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.cta-box{border-radius:12px;padding:18px;border:1px solid}
.cta-box h4{margin:0 0 8px;font-size:14px;font-weight:900}
.cta-box ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.8}
.cta-box li{margin-bottom:4px}
.cta-box.green{background:#f0fdf4;border-color:#bbf7d0}
.cta-box.green h4{color:#166534}
.cta-box.amber{background:#fffbeb;border-color:#fde68a}
.cta-box.amber h4{color:#92400e}
.cta-box.red{background:#fef2f2;border-color:#fecaca}
.cta-box.red h4{color:#991b1b}

.tabs{display:flex;gap:4px;border-bottom:2px solid #e2e8f0;margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 18px;border:0;background:transparent;color:#64748b;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:13px;white-space:nowrap}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.tab-content{display:none}
.tab-content.active{display:block}

/* ===== KESIMPULAN PSIKOLOGIS ===== */
.psych-conclusion{background:linear-gradient(135deg,#f8fafc,#eff6ff);border-left:4px solid #2563eb;border-radius:12px;padding:20px 24px;font-size:13.5px;line-height:1.8;color:#334155}
.psych-conclusion p{margin:0 0 14px}
.psych-conclusion p:last-child{margin-bottom:0}
.psych-conclusion b{color:#1e40af}

/* ===== HIGHLIGHT TABEL ===== */
tr.row-active{background:#dbeafe !important;border-left:5px solid #2563eb !important;font-weight:600}
tr.row-active td{border-bottom-color:#93c5fd !important}
tr.row-active-superior{background:#dcfce7 !important;border-left:5px solid #16a34a !important;font-weight:600}
tr.row-active-superior td{border-bottom-color:#86efac !important}
tr.row-active-warning{background:#fef3c7 !important;border-left:5px solid #d97706 !important;font-weight:600}
tr.row-active-warning td{border-bottom-color:#fcd34d !important}
tr.row-active-danger{background:#fee2e2 !important;border-left:5px solid #dc2626 !important;font-weight:600}
tr.row-active-danger td{border-bottom-color:#fca5a5 !important}

.badge-anda{display:inline-block;background:#2563eb;color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;margin-right:6px;letter-spacing:.5px}
.badge-anda-green{background:#16a34a}
.badge-anda-amber{background:#d97706}
.badge-anda-red{background:#dc2626}

@media(max-width:900px){
  .grid-2,.overall-panel,.cta-summary{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start}
  .toolbar select{min-width:100%}
}

    <h1>📋 In-Tray Exercise Report</h1>

<div class="wrap">

      <select id="resultSelect" onchange="loadResult()">
        <option value="">— Pilih peserta —</option>
      </select>
      <input id="searchInput" placeholder="🔍 Cari nama / ID..." oninput="filterList()" style="min-width:240px">
      <button onclick="exportCurrent()">⬇ Export Hasil Ini</button>
    </div>
  </div>

  <div id="reportContainer">
    <div class="card empty">

<script>
/* =========================================================
   IN-TRAY REPORT VIEWER v3.0 — FULL FIX
   - 8 aspek penilaian
   - Level manajerial universal
   - Kesimpulan psikologis 5-paragraf
   - Highlight tabel kategori
   - Fix kategori threshold
========================================================= */

let allResults = [];
let filteredResults = [];
let currentResult = null;
let charts = {};
let dataSource = "local";

const SUPABASE_TABLE = "intray_results";

/* ===== KUNCI PRIORITAS (Answer Key) ===== */
const PRIORITY_KEY = {
    1:  "High", 2:  "High", 3:  "High", 4:  "High", 5:  "High",
    6:  "High", 7:  "Medium", 8:  "High", 9:  "Low", 10: "High",
    11: "High", 12: "High", 13: "Medium", 14: "Low", 15: "High",
    16: "High", 17: "High"
};

/* ===== KATEGORI PER DOKUMEN ===== */
const DOC_CATEGORIES = {
    1: "Customer Complaint", 2: "Leasing Compliance", 3: "HR Turnover",
    4: "Sales Capacity", 5: "Inventory Fraud", 6: "Customer Complaint",
    7: "Whistleblowing", 8: "IT Audit", 9: "Vendor Offer",
    10: "Finance Compliance", 11: "Performance Review", 12: "Customer Trust",
    13: "Team Morale", 14: "External Event", 15: "Procurement Fraud",
    16: "Fleet Complaint", 17: "Service Overload"
};

/* ===== UTILITIES ===== */
function el(id){ return document.getElementById(id); }
function fmtDate(iso){
    if(!iso) return "-";
    try{
        return new Date(iso).toLocaleString("id-ID",{
            day:"2-digit",month:"short",year:"numeric",
            hour:"2-digit",minute:"2-digit"
        });
    }catch(e){ return iso; }
}
function clamp(x,a=0,b=100){ return Math.max(a,Math.min(b,x)); }
function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[c]));
}

/* =========================================================
   SCORING ENGINE
========================================================= */

function scorePriorityMatrix(answers) {
    if (!answers || typeof answers !== 'object') {
        return { score: 0, correct: 0, total: 17, details: [], avgJustification: 0 };
    }
    
    let correct = 0;
    const details = [];
    
    for (let docId = 1; docId <= 17; docId++) {
        const userAnswer = answers[docId] || answers[String(docId)];
        const correctAnswer = PRIORITY_KEY[docId];
        const userPriority = userAnswer?.priority || "";
        const userJustification = userAnswer?.justification || "";
        
        const isCorrect = userPriority === correctAnswer;
        if (isCorrect) correct++;
        
        let justificationScore = 0;
        if (userJustification.trim().length >= 50) justificationScore = 1;
        else if (userJustification.trim().length >= 20) justificationScore = 0.5;
        
        details.push({
            docId,
            category: DOC_CATEGORIES[docId],
            userPriority,
            correctPriority: correctAnswer,
            isCorrect,
            userJustification,
            justificationScore
        });
    }
    
    let score = 0;
    if (correct >= 14) score = 4;
    else if (correct >= 11) score = 3.5;
    else if (correct >= 9) score = 3;
    else if (correct >= 7) score = 2;
    else if (correct >= 5) score = 1;
    else score = 0;
    
    const avgJustification = details.reduce((sum, d) => sum + d.justificationScore, 0) / 17;
    if (avgJustification >= 0.7) score = Math.min(4, score + 0.5);
    
    return { score, correct, total: 17, details, avgJustification };
}

function scoreDecisionLog(decisionLog) {
    if (!Array.isArray(decisionLog) || decisionLog.length === 0) {
        return { score: 0, filled: 0, relevant: 0, details: [] };
    }
    
    const filled = decisionLog.filter(row => 
        row && (row.topic?.trim() || row.decision?.trim())
    ).length;
    
    let score = 0;
    if (filled >= 5) score = 4;
    else if (filled >= 4) score = 3;
    else if (filled >= 3) score = 2.5;
    else if (filled >= 2) score = 2;
    else if (filled >= 1) score = 1;
    
    const highTopics = ['customer', 'delivery', 'leasing', 'inventory', 'audit', 
                        'pencairan', 'fleet', 'compliance', 'vendor', 'bengkel',
                        'turnover', 'target', 'cti', 'trust'];
    
    const relevantCount = decisionLog.filter(row => {
        const text = `${row?.topic || ''} ${row?.decision || ''}`.toLowerCase();
        return highTopics.some(keyword => text.includes(keyword));
    }).length;
    
    if (relevantCount >= 4) score = Math.min(4, score + 0.5);
    
    return { score, filled, relevant: relevantCount, details: decisionLog };
}

function scoreActionPlan(plan) {
    if (!plan) return { score: 0, filledCount: 0, keywordCount: 0, details: {} };
    
    const plan24 = (plan.plan24 || '').trim();
    const plan30 = (plan.plan30 || '').trim();
    const plan90 = (plan.plan90 || '').trim();
    
    const len24 = plan24.length;
    const len30 = plan30.length;
    const len90 = plan90.length;
    
    let score = 0;
    let filledCount = 0;
    
    if (len24 >= 100) filledCount++;
    else if (len24 >= 30) filledCount += 0.5;
    
    if (len30 >= 100) filledCount++;
    else if (len30 >= 30) filledCount += 0.5;
    
    if (len90 >= 100) filledCount++;
    else if (len90 >= 30) filledCount += 0.5;
    
    score = filledCount * (4 / 3);
    score = Math.min(4, score);
    
    const strategicKeywords = ['audit', 'rekrut', 'sop', 'tender', 'kapasitas',
                               'training', 'evaluasi', 'monitoring', 'investigasi',
                               'customer', 'compliance', 'digital', 'loyalty'];
    
    const allText = (plan24 + ' ' + plan30 + ' ' + plan90).toLowerCase();
    const keywordCount = strategicKeywords.filter(k => allText.includes(k)).length;
    
    if (keywordCount >= 6) score = Math.min(4, score + 0.3);
    
    return { score, filledCount, keywordCount, details: { plan24, plan30, plan90 } };
}

/* =========================================================
   HITUNG 8 ASPEK PENILAIAN
========================================================= */
function calculateAllAspects(result) {
    const answers = result.answers || {};
    const priorityMatrix = answers.priorityMatrix || {};
    const decisionLog = answers.decisionLog || [];
    const actionPlan = answers.actionPlan || {};
    
    /* 1. PRIORITISASI (20%) */
    const priorityScore = scorePriorityMatrix(priorityMatrix);
    
    const allJustification = priorityScore.details
        .map(d => d.userJustification)
        .join(' ')
        .toLowerCase();
    
    /* 2. ANALYTICAL THINKING (15%) */
    const analyticalKeywords = ['keterkaitan', 'terkait', 'sistemik', 'fraud',
                                'pola', 'interconnected', 'terhubung',
                                'saling berkaitan', 'multiple', 'akar masalah'];
    const analyticalMatch = analyticalKeywords.filter(k => allJustification.includes(k)).length;
    
    let analyticalScore = 1;
    if (analyticalMatch >= 4) analyticalScore = 4;
    else if (analyticalMatch >= 3) analyticalScore = 3;
    else if (analyticalMatch >= 2) analyticalScore = 2.5;
    else if (analyticalMatch >= 1) analyticalScore = 1.5;
    
    /* 3. DECISION MAKING (15%) */
    const decisionScore = scoreDecisionLog(decisionLog);
    
    /* 4. STRATEGIC PLANNING (15%) */
    const planScore = scoreActionPlan(actionPlan);
    
    /* 5. OPERATIONAL ACUMEN (10%) */
    const operationalKeywords = ['cabang', 'bandung', 'operasional', 'target',
                                  'revenue', 'sales', 'after-sales', 'bengkel',
                                  'stok', 'inventory', 'kapasitas'];
    const opMatch = operationalKeywords.filter(k => allJustification.includes(k)).length;
    
    let operationalScore = 0;
    if (opMatch >= 5) operationalScore = 4;
    else if (opMatch >= 4) operationalScore = 3.5;
    else if (opMatch >= 3) operationalScore = 3;
    else if (opMatch >= 2) operationalScore = 2;
    else if (opMatch >= 1) operationalScore = 1;
    
    /* 6. PEOPLE MANAGEMENT (10%) */
    const peopleKeywords = ['budi', 'dedi', 'el rumi', 'dian', 'regional',
                            'supervisor', 'spv', 'tim', 'stakeholder', 'pic',
                            'koordinasi', 'libatkan', 'komunikasi'];
    const peopleMatch = peopleKeywords.filter(k => allJustification.includes(k)).length;
    
    let peopleScore = 0;
    if (peopleMatch >= 5) peopleScore = 4;
    else if (peopleMatch >= 4) peopleScore = 3.5;
    else if (peopleMatch >= 3) peopleScore = 3;
    else if (peopleMatch >= 2) peopleScore = 2;
    else if (peopleMatch >= 1) peopleScore = 1;
    
    /* 7. FINANCIAL AWARENESS (5%) */
    const financeKeywords = ['rp', 'miliar', 'juta', 'biaya', 'cash flow',
                              'compliance', 'penalti', 'kerugian', 'efisiensi',
                              'anggaran', 'budget'];
    const finMatch = financeKeywords.filter(k => allJustification.includes(k)).length;
    
    let financeScore = 0;
    if (finMatch >= 4) financeScore = 4;
    else if (finMatch >= 3) financeScore = 3;
    else if (finMatch >= 2) financeScore = 2.5;
    else if (finMatch >= 1) financeScore = 1.5;
    
    /* 8. COMMUNICATION & ETHICS (10%) */
    const ethicsKeywords = ['etika', 'integritas', 'whistleblowing', 'fraud',
                            'investigasi', 'transparan', 'jujur', 'profesional',
                            'compliance', 'kepatuhan'];
    const ethicsMatch = ethicsKeywords.filter(k => allJustification.includes(k)).length;
    
    let ethicsScore = 1.5;
    if (ethicsMatch >= 4) ethicsScore = 4;
    else if (ethicsMatch >= 3) ethicsScore = 3.5;
    else if (ethicsMatch >= 2) ethicsScore = 3;
    else if (ethicsMatch >= 1) ethicsScore = 2;
    
    /* HITUNG SKOR TOTAL BERBOBOT */
    const aspects = [
        { name: "Prioritisasi & Risk Assessment", code: "PRIORITY",    score: priorityScore.score, weight: 0.20, desc: "Klasifikasi 17 dokumen + justifikasi" },
        { name: "Analytical Thinking",            code: "ANALYTICAL",  score: analyticalScore,     weight: 0.15, desc: "Kedalaman analisis & keterkaitan antar dokumen" },
        { name: "Decision Making",                code: "DECISION",    score: decisionScore.score, weight: 0.15, desc: "Kualitas keputusan taktis 6 jam pertama" },
        { name: "Strategic Planning",             code: "STRATEGIC",   score: planScore.score,     weight: 0.15, desc: "Rencana 24 jam, 30 hari, 90 hari" },
        { name: "Operational & Business Acumen",  code: "OPERATIONAL", score: operationalScore,    weight: 0.10, desc: "Pemahaman konteks operasional & bisnis" },
        { name: "People & Stakeholder Mgmt",      code: "PEOPLE",      score: peopleScore,         weight: 0.10, desc: "Kemampuan melibatkan pihak yang tepat" },
        { name: "Financial Awareness",            code: "FINANCIAL",   score: financeScore,        weight: 0.05, desc: "Kesadaran aspek finansial & compliance" },
        { name: "Communication & Ethics",         code: "ETHICS",      score: ethicsScore,         weight: 0.10, desc: "Kejelasan komunikasi & pertimbangan etis" }
    ];
    
    const totalScore = aspects.reduce((sum, a) => sum + (a.score * a.weight), 0);
    const maxScore = 4.0;
    const percentage = (totalScore / maxScore) * 100;
    
    /* KATEGORI + LEVEL + KESIMPULAN PSIKOLOGIS */
    let category, percentile, level, positionExample, description, conclusion;
    let tierKey; /* untuk highlight */
    
    if (percentage >= 87.5) {
        tierKey = "sangat-superior";
        category = "Sangat Superior";
        percentile = "Top 5%";
        level = "Eksekutif / C-Level";
        positionExample = "Head of Division, Director, BOD";
        description = "Kandidat menunjukkan kemampuan manajerial strategis tingkat tinggi dengan pola pikir sistemik dan holistik.";
        conclusion = `
            <p><b>Dinamika Berpikir:</b> Kandidat memiliki pola pikir <b>sistemik-holistik</b> — mampu melihat keterkaitan antar permasalahan (fraud, compliance, customer trust, operasional) sebagai satu ekosistem yang saling mempengaruhi, bukan kejadian terpisah.</p>

/* =========================================================
   LOAD DATA
========================================================= */
async function loadFromSupabase(){
  try {
    let sb = window.supabaseClient || window.supabase || null;
    if (!sb) return null;
    const { data, error } = await sb.from(SUPABASE_TABLE)
        .select("*")
        .eq("result_type", "INTRAY")
        .order("submitted_at", { ascending: false })
        .limit(500);
    if (error) { console.warn("[INTRAY] Supabase error:", error.message); return null; }
    if (!Array.isArray(data) || data.length === 0) return null;
    return data.map(row => ({
      version: row.version || 1,
      resultType: "INTRAY",
      projectId: row.project_id,
      participantId: row.participant_id,
      assessmentIndex: row.assessment_index,
      assessmentCode: row.assessment_code,
      assessmentName: row.assessment_name,
      participantName: row.participant_name || "",
      answers: typeof row.raw_data === "string" ? JSON.parse(row.raw_data) : row.raw_data,
      metadata: typeof row.scores === "string" ? JSON.parse(row.scores) : row.scores,
      submittedAt: row.submitted_at,
      _source: "supabase"
    }));
  } catch(e) { console.warn("[INTRAY] Gagal load Supabase:", e); return null; }
}

function loadFromLocal(){
  try {
    return JSON.parse(localStorage.getItem("talent_scope_results") || "[]")
      .filter(x => x.resultType === "INTRAY")
      .map(r => ({ ...r, _source: "local" }));
  } catch(e) { return []; }
}

async function refreshList(){
  el("reportContainer").innerHTML = `<div class="card empty"><h3>⏳ Memuat data...</h3></div>`;
  try {
    let results = await loadFromSupabase();
    if (results && results.length > 0) {
      allResults = results;
      dataSource = "supabase";
      el("sourceBadge").textContent = "☁ Supabase";
      el("sourceBadge").className = "badge badge-source";
    } else {
      allResults = loadFromLocal();
      dataSource = "local";
      el("sourceBadge").textContent = "📦 LocalStorage";
      el("sourceBadge").className = "badge badge-local";
    }
    allResults.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
    filteredResults = [...allResults];
    renderDropdown();
    if (allResults.length === 0) {
      el("reportContainer").innerHTML = `<div class="card empty"><h3>Belum ada hasil</h3><p>Belum ada peserta yang menyelesaikan In-Tray Exercise.</p></div>`;
    } else {
      el("reportContainer").innerHTML = `<div class="card empty"><h3>Pilih peserta</h3><p>Pilih peserta dari dropdown di atas.</p></div>`;
    }
  } catch(err) {
    console.error("[INTRAY] Refresh error:", err);
    el("reportContainer").innerHTML = `<div class="card empty"><h3>⚠ Gagal memuat</h3><p>${err.message}</p></div>`;
  }
}

function renderDropdown(){
  const sel = el("resultSelect");
  sel.innerHTML = '<option value="">— Pilih peserta (' + filteredResults.length + ') —</option>';
  filteredResults.forEach((r) => {
    const opt = document.createElement("option");
    opt.value = allResults.indexOf(r);
    opt.textContent = `${r.participantName || r.participantId || "Unknown"} • ${fmtDate(r.submittedAt)}`;
    sel.appendChild(opt);
  });
}

function filterList(){
  const q = el("searchInput").value.toLowerCase().trim();
  filteredResults = !q ? [...allResults] : allResults.filter(r =>
    String(r.participantId || "").toLowerCase().includes(q) ||
    String(r.participantName || "").toLowerCase().includes(q)
  );
  renderDropdown();
}

function loadResult(){
  const idx = el("resultSelect").value;
  if(idx === ""){
    el("reportContainer").innerHTML = `<div class="card empty"><h3>Pilih peserta</h3></div>`;
    currentResult = null;
    return;
  }
  currentResult = allResults[Number(idx)];
  renderReport(currentResult);
}

function switchTab(event, tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

function renderRadar(aspects){
    const ctx = el("radarChart");
    if(!ctx) return;
    if(charts.radar) charts.radar.destroy();
    charts.radar = new Chart(ctx, {
        type: "radar",
        data: {
            labels: aspects.map(a => a.name.split(' ').slice(0, 2).join(' ')),
            datasets: [{
                label: "Skor Peserta",
                data: aspects.map(a => (a.score / 4) * 100),
                borderColor: "#2563eb",
                backgroundColor: "rgba(37,99,235,.18)",
                pointBackgroundColor: "#2563eb",
                pointRadius: 5
            }, {
                label: "Benchmark 60%",
                data: aspects.map(() => 60),
                borderColor: "#94a3b8",
                backgroundColor: "rgba(148,163,184,.08)",
                borderDash: [4, 4],
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: "bottom" } },
            scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 25 } } }
        }
    });
}

function exportCurrent(){
  if(!currentResult) return alert("Pilih hasil dulu.");
  const analysis = calculateAllAspects(currentResult);
  const exportData = { ...currentResult, analysis };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `INTRAY_${currentResult.participantId}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportAll(){
  if(!allResults.length) return alert("Belum ada data.");
  const all = allResults.map(r => ({ ...r, analysis: calculateAllAspects(r) }));
  const blob = new Blob([JSON.stringify(all, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `INTRAY_all_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participant Profile | TalentScope</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/profile.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- Sidebar -->
    <!-- ========================= -->

    <aside class="sidebar"></aside>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <div class="main">

        <!-- Header -->

        <header class="header"></header>

        <!-- Content -->

        <main class="content">

            

            <!-- ===================================== -->
            <!-- WIZARD -->
            <!-- ===================================== -->

            <section class="wizard">

                <div class="wizard-item active">

                    <div class="wizard-number">
                        1
                    </div>

                    <div class="wizard-info">

                        <h4>Participant</h4>

                        <span>Identity</span>

                    </div>

                </div>

                <div class="wizard-line"></div>

                <div class="wizard-item">

                    <div class="wizard-number">
                        2
                    </div>

                    <div class="wizard-info">

                        <h4>Assessment</h4>

                        <span>Package</span>

                    </div>

                </div>

                <div class="wizard-line"></div>

                <div class="wizard-item">

                    <div class="wizard-number">
                        3
                    </div>

                    <div class="wizard-info">

                        <h4>Review</h4>

                        <span>Confirmation</span>

                    </div>

                </div>

            </section>

            <!-- ===================================== -->
            <!-- CARD -->
            <!-- ===================================== -->

            <section class="profile-card">

                <div class="card-header">

                    <h2>Participant Information</h2>

                    <p>
                        All fields marked with <span class="required">*</span> are required.
                    </p>

                </div>

                <form id="participantForm" class="profile-form" novalidate>

                    <div class="form-grid">

                        <!-- Assessment Number -->

                        <div class="form-group">

                            <label>

                                Assessment Number

                                <span class="required">*</span>

                            </label>

                            <input
                                id="assessmentNumber"
                                type="text"
                                placeholder="TS-2026-000001"
                                required>

                        </div>

                        <!-- Full Name -->

                        <div class="form-group">

                            <label>

                                Full Name

                                <span class="required">*</span>

                            </label>

                            <input
                                id="fullName"
                                type="text"
                                placeholder="Participant Name"
                                required>

                        </div>

                        <!-- Age -->

                        <div class="form-group">

                            <label>

                                Age

                                <span class="required">*</span>

                            </label>

                            <input
                                id="age"
                                type="number"
                                min="17"
                                max="70"
                                placeholder="25"
                                required>

                        </div>

                        <!-- Gender -->

                        <div class="form-group">

                            <label>

                                Gender

                                <span class="required">*</span>

                            </label>

                            <select id="gender" required>

                                <option value="">
                                    Select Gender
                                </option>

                                <option>
                                    Male
                                </option>

                                <option>
                                    Female
                                </option>

                            </select>

                        </div>

                        <!-- Date -->

                        <div class="form-group">

                            <label>

                                Assessment Date

                                <span class="required">*</span>

                            </label>

                            <input
                                id="assessmentDate"
                                type="date"
                                required>

                        </div>

                        <!-- Position -->

                        <div class="form-group">

                            <label>

                                Position

                                <span class="required">*</span>

                            </label>

                            <input
                                id="position"
                                type="text"
                                placeholder="Supervisor"
                                required>

                        </div>

                        <!-- Company -->

                        <div class="form-group">

                            <label>

                                Company

                                <span class="required">*</span>

                            </label>

                            <input
                                id="company"
                                type="text"
                                placeholder="PT TalentScope Indonesia"
                                required>

                        </div>

                        <!-- Phone -->

                        <div class="form-group">

                            <label>

                                Phone Number

                                <span class="required">*</span>

                            </label>

                            <input
                                id="phone"
                                type="tel"
                                placeholder="08xxxxxxxxxx"
                                required>

                        </div>

                        

                    </div>

                </form>

            </section>

            <!-- ===================================== -->
            <!-- ACTION -->
            <!-- ===================================== -->

            <section class="form-actions">

                <button
                    type="button"
                    class="btn btn-outline"
                    id="btnCancel">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="btnSave">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save & Continue

                </button>

            </section>

        </main>

    </div>

</div>

<script src="js/layout/layout-loader.js"></script>
<script src="js/identitas.js"></script>

</body>
</html>

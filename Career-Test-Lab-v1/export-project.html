<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Peserta — TalentScope</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --primary:#1167ea;
    --primary-dark:#0b52c4;
    --navy:#0f172a;
    --slate:#475569;
    --muted:#64748b;
    --line:#e2e8f0;
    --soft:#f8fafc;
    --bg:#f4f7fb;
}
body{
    background:var(--bg);
    color:var(--navy);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1300px;margin:0 auto}

.toolbar-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 24px;
    margin-bottom:24px;
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(15,23,42,.05);
}
.toolbar-card label{
    font-weight:700;
    font-size:13px;
    color:var(--slate);
    display:flex;
    align-items:center;
    gap:8px;
}
select,input,button{
    padding:11px 16px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font:inherit;
    background:#fff;
    font-size:13px;
    transition:all .15s ease;
}
select{min-width:360px;flex:1;font-weight:600;color:var(--navy);cursor:pointer}
select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(17,103,234,.08);outline:none}
button{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    border:0;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(17,103,234,.20);
    display:inline-flex;
    align-items:center;
    gap:8px;
}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(17,103,234,.28)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
button.ghost{
    background:#fff;
    color:var(--slate);
    border:1px solid #cbd5e1;
    box-shadow:none;
    font-weight:600;
}
button.ghost:hover{background:var(--soft);transform:none;box-shadow:none}

.report-page{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 40px;
    margin-bottom:24px;
    box-shadow:0 4px 20px rgba(15,23,42,.06);
    page-break-after:always;
    break-after:page;
}
.report-page:last-child{page-break-after:auto;break-after:auto}

.page-header{
    border-bottom:3px solid var(--primary);
    padding-bottom:20px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
}
.page-header-left h2{
    font-size:24px;
    font-weight:900;
    color:var(--navy);
    margin:0 0 6px;
    letter-spacing:-0.3px;
    display:flex;
    align-items:center;
    gap:10px;
}
.page-header-left .subtitle{
    font-size:13px;
    color:var(--muted);
    margin:0;
}
.page-header-right{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    line-height:1.8;
}
.page-header-right .meta-item{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}
.page-header-right .meta-item strong{
    color:var(--navy);
    font-weight:700;
    min-width:90px;
    text-align:left;
}

.identity-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:8px;
}
.identity-section{
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 24px;
    transition:border-color .15s ease;
}
.identity-section:hover{border-color:#cbd5e1}
.identity-section h4{
    margin:0 0 14px;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--primary);
    padding-bottom:10px;
    border-bottom:2px solid #cfe3fa;
    display:flex;
    align-items:center;
    gap:8px;
}
.identity-row{
    display:grid;
    grid-template-columns:150px 1fr;
    gap:14px;
    padding:9px 0;
    border-bottom:1px dashed #e9eef6;
    font-size:13px;
    align-items:start;
}
.identity-row:last-child{border-bottom:0}
.identity-row .label{
    color:var(--muted);
    font-weight:600;
    line-height:1.5;
    font-size:12px;
}
.identity-row .value{
    color:var(--navy);
    font-weight:700;
    text-align:left;
    word-break:break-word;
    line-height:1.5;
}
.identity-row .value.code{
    font-family:'SF Mono',Consolas,monospace;
    background:#eef4fd;
    color:var(--primary);
    padding:2px 8px;
    border-radius:6px;
    font-size:12px;
    width:fit-content;
}
.identity-row .value.badge-success{
    background:#dcfce7;
    color:#166534;
    padding:3px 10px;
    border-radius:99px;
    font-size:11px;
    width:fit-content;
}
.identity-row .value.badge-warning{
    background:#fef3c7;
    color:#92400e;
    padding:3px 10px;
    border-radius:99px;
    font-size:11px;
    width:fit-content;
}
.identity-row .value.badge-info{
    background:#dbeafe;
    color:#1e40af;
    padding:3px 10px;
    border-radius:99px;
    font-size:11px;
    width:fit-content;
}

.log-activity{
    max-height:780px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:12px;
    margin-top:8px;
    background:#fff;
}
.log-item{
    padding:14px 20px;
    border-bottom:1px solid #f1f5f9;
    display:grid;
    grid-template-columns:180px 1fr;
    gap:18px;
    align-items:start;
    transition:background .15s ease;
}
.log-item:hover{background:var(--soft)}
.log-item:last-child{border-bottom:0}
.log-time{
    font-size:11.5px;
    color:var(--muted);
    font-family:'SF Mono',Consolas,monospace;
    white-space:nowrap;
    padding-top:3px;
    line-height:1.5;
}
.log-content{min-width:0}
.log-activity-title{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:4px;
    display:flex;
    align-items:flex-start;
    gap:8px;
    flex-wrap:wrap;
    line-height:1.45;
}
.log-description{
    font-size:12px;
    color:var(--muted);
    line-height:1.55;
}
.log-badge{
    display:inline-flex;
    align-items:center;
    padding:2px 8px;
    border-radius:99px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.3px;
    white-space:nowrap;
}
.b-login{background:#dcfce7;color:#166534}
.b-logout{background:#fee2e2;color:#991b1b}
.b-tab{background:#fef3c7;color:#92400e}
.b-test{background:#dbeafe;color:#1e40af}
.b-warning{background:#fecaca;color:#991b1b}
.b-event{background:#e2e8f0;color:#475569}

.empty{
    text-align:center;
    padding:80px 20px;
    color:#94a3b8;
    font-size:14px;
}
.empty h3{
    color:var(--slate);
    margin:0 0 10px;
    font-size:18px;
    font-weight:800;
}
.empty p{color:var(--muted);font-size:13px;margin:0}

.loading{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
    font-size:13px;
}
.spinner{
    display:inline-block;
    width:22px;
    height:22px;
    border:3px solid #e2e8f0;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-right:12px;
    vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff;padding:0}
    .toolbar-card{display:none!important}
    .report-page{
        border:0;
        box-shadow:none;
        padding:0;
        margin:0;
        page-break-after:always;
        break-after:page;
    }
    .report-page:last-child{page-break-after:auto;break-after:auto}
    .log-activity{max-height:none;overflow:visible;border:1px solid #e2e8f0}
    .log-item{page-break-inside:avoid;break-inside:avoid}
    .identity-section{page-break-inside:avoid;break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media(max-width:768px){
    body{padding:16px}
    select{min-width:100%}
    .report-page{padding:24px 20px}
    .page-header{flex-direction:column;align-items:flex-start}
    .page-header-right{text-align:left}
    .page-header-right .meta-item{justify-content:flex-start}
    .page-header-right .meta-item strong{min-width:auto}
    .identity-grid{grid-template-columns:1fr}
    .identity-row{grid-template-columns:130px 1fr}
    .log-item{grid-template-columns:1fr;gap:6px}
    .log-time{font-size:11px}
}
</style>
</head>
<body>

<div class="wrap">
    <div class="toolbar-card">
        <label>
            <span style="font-size:16px">👤</span>
            Peserta:
        </label>
        <select id="participantSelect" onchange="loadParticipantData()">
            <option value="">— Pilih Peserta —</option>
        </select>
        <button onclick="exportPDF()" id="exportBtn" disabled>
            📄 Export PDF
        </button>
        <button class="ghost" onclick="refreshParticipants()">
            🔄 Refresh
        </button>
    </div>

    <div id="reportContainer">
        <div class="report-page">
            <div class="loading">
                <span class="spinner"></span>
                Memuat daftar peserta...
            </div>
        </div>
    </div>
</div>

<script>
/* ==========================================================
   EXPORT PESERTA PAGE — v3 FIXED
   - Query participants langsung by project_id (tanpa tabel perantara)
========================================================== */

let currentProject = null;
let currentParticipant = null;
let participants = [];

function el(id) {
    return document.getElementById(id);
}

function escapeHtml(v) {
    return String(v == null ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function fmtDate(iso) {
    if (!iso) return "-";
    try {
        return new Date(iso).toLocaleString("id-ID", {
            day: "2-digit", month: "short", year: "numeric",
            hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
    } catch (e) { return iso; }
}

function fmtDateOnly(iso) {
    if (!iso) return "-";
    try {
        return new Date(iso).toLocaleDateString("id-ID", {
            day: "2-digit", month: "short", year: "numeric"
        });
    } catch (e) { return iso; }
}

function pickProjectCode(project) {
    return String(
        project.project_code ||
        project.projectCode ||
        project.code ||
        project.id ||
        "-"
    ).trim();
}

function pickParticipantCode(p) {
    return String(
        p.participant_code ||
        p.participantCode ||
        p.employee_id ||
        "-"
    ).trim();
}

async function waitForSupabaseClient(timeoutMs) {
    const start = Date.now();
    while (!window.supabaseClient && Date.now() - start < timeoutMs) {
        await new Promise(r => setTimeout(r, 100));
    }
    return !!window.supabaseClient;
}

/* ==========================================================
   LOAD PARTICIPANTS
========================================================== */
async function refreshParticipants() {
    const sel = el("participantSelect");
    sel.innerHTML = '<option value="">— Memuat peserta... —</option>';

    const params = new URLSearchParams(window.location.search);
    const projectIdParam = params.get("projectId");

    if (!projectIdParam) {
        sel.innerHTML = '<option value="">— Project ID tidak ada di URL —</option>';
        el("reportContainer").innerHTML = `
            <div class="report-page">
                <div class="empty">
                    <h3>⚠ Project ID Tidak Ada</h3>
                    <p>Buka halaman ini dari tombol Export di halaman Project Access.</p>
                </div>
            </div>`;
        return;
    }

    const ready = await waitForSupabaseClient(5000);
    if (!ready) {
        sel.innerHTML = '<option value="">— Supabase tidak tersedia —</option>';
        return;
    }

    try {
        const sb = window.supabaseClient;
        const selectCols = "id, name, project_name, project_code, company, client, pic, start_date, created_at";

        // 1. Cari project by id ATAU project_code
        let projData = null;

        const { data: byIdArr, error: errId } = await sb
            .from("projects").select(selectCols)
            .eq("id", projectIdParam)
            .limit(1);

        if (errId) console.warn("[Export] Query by id error:", errId);

        projData = (byIdArr && byIdArr.length > 0) ? byIdArr[0] : null;

        if (!projData) {
            const { data: byCodeArr, error: errCode } = await sb
                .from("projects").select(selectCols)
                .eq("project_code", projectIdParam)
                .limit(1);

            if (errCode) console.warn("[Export] Query by code error:", errCode);

            projData = (byCodeArr && byCodeArr.length > 0) ? byCodeArr[0] : null;
        }

        if (!projData) {
            throw new Error(`Project tidak ditemukan untuk ID/code: "${projectIdParam}"`);
        }
        currentProject = projData;
        console.log("[Export] Project loaded:", projData);

        // 2. Load participants LANGSUNG by project_id
        //    (kolom project_id ada di tabel participants)
        let parts = [];

        const { data: directParts, error: directErr } = await sb
            .from("participants")
            .select("*")
            .eq("project_id", projData.id);

        if (directErr) {
            console.warn("[Export] Direct participants query error:", directErr.message);

            // Fallback: pakai tabel perantara project_participants
            const { data: relations, error: relErr } = await sb
                .from("project_participants")
                .select("*")
                .eq("project_id", projData.id);

            if (relErr) {
                throw new Error("Gagal akses participants: " + directErr.message);
            }

            if (Array.isArray(relations) && relations.length > 0) {
                const pids = relations
                    .map(r => r.participant_id)
                    .filter(Boolean);

                if (pids.length > 0) {
                    const { data: rawParts, error: partErr } = await sb
                        .from("participants")
                        .select("*")
                        .in("id", pids);

                    if (partErr) {
                        throw new Error("Gagal akses participants: " + partErr.message);
                    }
                    if (Array.isArray(rawParts)) {
                        parts = rawParts;
                    }
                }
            }
        } else if (Array.isArray(directParts)) {
            parts = directParts;
            console.log("[Export] Direct participants loaded:", parts.length);
        }

        // Merge raw_data
        parts = parts.map(p => Object.assign({}, p.raw_data || {}, p));
        participants = parts;

        console.log("[Export] Final participants:", participants.length);

        // 3. Isi dropdown
        sel.innerHTML = '<option value="">— Pilih Peserta —</option>';
        if (participants.length === 0) {
            sel.innerHTML = '<option value="">— Belum ada peserta —</option>';
            el("reportContainer").innerHTML = `
                <div class="report-page">
                    <div class="empty">
                        <h3>👤 Belum Ada Peserta</h3>
                        <p>Project ini belum memiliki peserta yang terdaftar.</p>
                    </div>
                </div>`;
            return;
        }

        participants.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            const name = p.name || p.full_name || p.participant_code || "Tanpa Nama";
            const email = p.email ? " — " + p.email : "";
            opt.textContent = name + email;
            sel.appendChild(opt);
        });

        // 4. Auto-select dari URL
        const urlParticipantId = params.get("participantId");
        if (urlParticipantId && [...sel.options].some(o => o.value === urlParticipantId)) {
            sel.value = urlParticipantId;
            loadParticipantData();
        } else {
            el("reportContainer").innerHTML = `
                <div class="report-page">
                    <div class="empty">
                        <h3>👤 Pilih Peserta</h3>
                        <p>Pilih peserta dari dropdown di atas untuk melihat dan mengekspor data.</p>
                    </div>
                </div>`;
        }

    } catch (e) {
        console.error("[Export] Gagal load:", e);
        sel.innerHTML = '<option value="">— Gagal memuat —</option>';
        el("reportContainer").innerHTML = `
            <div class="report-page">
                <div class="empty">
                    <h3>⚠ Gagal Memuat Peserta</h3>
                    <p>${escapeHtml(e.message)}</p>
                </div>
            </div>`;
    }
}

/* ==========================================================
   LOAD DATA PESERTA TERPILIH
========================================================== */
function loadParticipantData() {
    const participantId = el("participantSelect").value;
    if (!participantId) {
        el("reportContainer").innerHTML = `
            <div class="report-page">
                <div class="empty">
                    <h3>👤 Pilih Peserta</h3>
                    <p>Pilih peserta dari dropdown di atas.</p>
                </div>
            </div>
        `;
        el("exportBtn").disabled = true;
        return;
    }

    const participant = participants.find(function(p) {
        return String(p.id) === String(participantId);
    });

    if (!participant) {
        el("reportContainer").innerHTML = `
            <div class="report-page">
                <div class="empty"><h3>Peserta Tidak Ditemukan</h3></div>
            </div>
        `;
        return;
    }

    currentParticipant = participant;
    renderParticipantReport(participant);
    el("exportBtn").disabled = false;
}

/* ==========================================================
   RENDER REPORT — 2 HALAMAN
========================================================== */
function renderParticipantReport(p) {
    const project = currentProject || {};
    const projectName = project.name || project.project_name || "Tanpa Nama";
    const projectCode = pickProjectCode(project);
    const company = project.company || project.client || "-";
    const pic = project.pic || "-";
    const startDate = project.start_date || project.created_at;

    const rawData = p.raw_data || {};
    const name = p.name || p.full_name || "-";
    const email = p.email || "-";
    const phone = p.phone || p.telepon || rawData.phone || rawData.telepon || "-";
    const edu = p.education || p.pendidikan || rawData.education || rawData.pendidikan || "-";
    const pos = p.position || p.posisi || rawData.position || rawData.posisi || "-";
    const purpose = p.purpose || p.tujuanTes || rawData.purpose || rawData.tujuanTes || "-";
    const invitation = p.invitationStatus || p.invitation_status || "Invited";
    const assessmentStatus = p.assessmentStatus || p.status || "Not Started";
    const participantCode = pickParticipantCode(p);

    let loginTime = p.loginTime || p.login_at || p.loggedInAt || "-";
    let logoutTime = p.logoutTime || p.logout_at || p.loggedOutAt || "-";
    const history = p.activityHistory || p.activity_history || [];

    if (!loginTime || loginTime === "-") {
        const loginEvents = history.filter(function(h) {
            return h.type === "login" || (h.activity || "").toLowerCase().includes("login");
        });
        if (loginEvents.length > 0) {
            loginEvents.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
            loginTime = loginEvents[0].timestamp;
        }
    }

    if (!logoutTime || logoutTime === "-") {
        const logoutEvents = history.filter(function(h) {
            return h.type === "logout" || (h.activity || "").toLowerCase().includes("logout");
        });
        if (logoutEvents.length > 0) {
            logoutEvents.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
            logoutTime = logoutEvents[0].timestamp;
        }
    }

    const invitationClass = /accepted|invited/i.test(invitation) ? "badge-success" : "badge-warning";
    const assessmentClass = /completed|selesai|active/i.test(assessmentStatus) ? "badge-success" : "badge-warning";

    const page1 = `
        <div class="report-page">
            <div class="page-header">
                <div class="page-header-left">
                    <h2>📋 Identitas Peserta</h2>
                    <p class="subtitle">Data lengkap peserta <strong>${escapeHtml(name)}</strong></p>
                </div>
                <div class="page-header-right">
                    <div class="meta-item"><strong>Project:</strong> <span>${escapeHtml(projectName)}</span></div>
                    <div class="meta-item"><strong>Project Code:</strong> <span>${escapeHtml(projectCode)}</span></div>
                    <div class="meta-item"><strong>Tanggal:</strong> <span>${escapeHtml(fmtDateOnly(startDate))}</span></div>
                </div>
            </div>

            <div class="identity-grid">
                <div class="identity-section">
                    <h4>👤 Informasi Personal</h4>
                    <div class="identity-row"><span class="label">Nama Lengkap</span><span class="value">${escapeHtml(name)}</span></div>
                    <div class="identity-row"><span class="label">Kode Peserta</span><span class="value code">${escapeHtml(participantCode)}</span></div>
                    <div class="identity-row"><span class="label">Email</span><span class="value">${escapeHtml(email)}</span></div>
                    <div class="identity-row"><span class="label">No. Telepon</span><span class="value">${escapeHtml(phone)}</span></div>
                    <div class="identity-row"><span class="label">Pendidikan</span><span class="value">${escapeHtml(edu)}</span></div>
                    <div class="identity-row"><span class="label">Posisi</span><span class="value">${escapeHtml(pos)}</span></div>
                </div>

                <div class="identity-section">
                    <h4>📁 Informasi Project</h4>
                    <div class="identity-row"><span class="label">Nama Project</span><span class="value">${escapeHtml(projectName)}</span></div>
                    <div class="identity-row"><span class="label">Project Code</span><span class="value code">${escapeHtml(projectCode)}</span></div>
                    <div class="identity-row"><span class="label">Klien / Perusahaan</span><span class="value">${escapeHtml(company)}</span></div>
                    <div class="identity-row"><span class="label">PIC</span><span class="value">${escapeHtml(pic)}</span></div>
                    <div class="identity-row"><span class="label">Tujuan Asesmen</span><span class="value">${escapeHtml(purpose)}</span></div>
                    <div class="identity-row"><span class="label">Tanggal Asesmen</span><span class="value">${escapeHtml(fmtDateOnly(startDate))}</span></div>
                </div>

                <div class="identity-section">
                    <h4>🎯 Status Asesmen</h4>
                    <div class="identity-row"><span class="label">Status Invitation</span><span class="value ${invitationClass}">${escapeHtml(invitation)}</span></div>
                    <div class="identity-row"><span class="label">Status Asesmen</span><span class="value ${assessmentClass}">${escapeHtml(assessmentStatus)}</span></div>
                    <div class="identity-row"><span class="label">Waktu Login</span><span class="value">${escapeHtml(fmtDate(loginTime))}</span></div>
                    <div class="identity-row"><span class="label">Waktu Logout</span><span class="value">${escapeHtml(fmtDate(logoutTime))}</span></div>
                </div>

                <div class="identity-section">
                    <h4>📊 Ringkasan Aktivitas</h4>
                    <div class="identity-row"><span class="label">Total Event Log</span><span class="value">${history.length} event</span></div>
                    <div class="identity-row"><span class="label">Pindah Tab</span><span class="value">${history.filter(h => (h.type || "").includes("tab")).length}×</span></div>
                    <div class="identity-row"><span class="label">Peringatan</span><span class="value">${history.filter(h => (h.type || "").includes("warning")).length}×</span></div>
                    <div class="identity-row"><span class="label">Sesi Login</span><span class="value">${history.filter(h => (h.type || "").includes("login")).length}×</span></div>
                </div>
            </div>
        </div>
    `;

    let logItemsHtml = "";

    if (history.length === 0) {
        logItemsHtml = `<div style="text-align:center;padding:60px 20px;color:#94a3b8">Belum ada aktivitas tercatat.</div>`;
    } else {
        const sorted = history.slice().sort(function(a, b) {
            return new Date(b.timestamp || b.time || 0) - new Date(a.timestamp || a.time || 0);
        });

        sorted.forEach(function(h) {
            const ts = h.timestamp || h.time || h.date || "-";
            const title = h.activity || h.title || h.action || h.description || "-";
            const desc = h.description || "";
            const type = String(h.type || "").toLowerCase();

            let badgeClass = "b-event";
            let badgeText = "Event";
            if (type.includes("logout") || type.includes("offline")) { badgeClass = "b-logout"; badgeText = "Logout"; }
            else if (type.includes("login") || type.includes("online")) { badgeClass = "b-login"; badgeText = "Login"; }
            else if (type.includes("tab")) { badgeClass = "b-tab"; badgeText = "Tab"; }
            else if (type.includes("test")) { badgeClass = "b-test"; badgeText = "Test"; }
            else if (type.includes("warning") || type.includes("peringatan")) { badgeClass = "b-warning"; badgeText = "Warning"; }

            logItemsHtml += `
                <div class="log-item">
                    <div class="log-time">${escapeHtml(fmtDate(ts))}</div>
                    <div class="log-content">
                        <div class="log-activity-title">
                            <span>${escapeHtml(title)}</span>
                            <span class="log-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        ${desc && desc !== title ? `<div class="log-description">${escapeHtml(desc)}</div>` : ""}
                    </div>
                </div>
            `;
        });
    }

    const page2 = `
        <div class="report-page">
            <div class="page-header">
                <div class="page-header-left">
                    <h2>📜 Log Aktivitas</h2>
                    <p class="subtitle">Riwayat aktivitas lengkap <strong>${escapeHtml(name)}</strong></p>
                </div>
                <div class="page-header-right">
                    <div class="meta-item"><strong>Total Event:</strong> <span>${history.length}</span></div>
                    <div class="meta-item"><strong>Project:</strong> <span>${escapeHtml(projectName)}</span></div>
                </div>
            </div>
            <div class="log-activity">${logItemsHtml}</div>
        </div>
    `;

    el("reportContainer").innerHTML = page1 + page2;
}

/* ==========================================================
   EXPORT PDF
========================================================== */
function exportPDF() {
    const participantId = el("participantSelect").value;
    if (!participantId) return alert("Pilih peserta dulu.");

    const name = currentParticipant?.name || currentParticipant?.full_name || "Peserta";
    const projectCode = pickProjectCode(currentProject);
    const originalTitle = document.title;

    document.title = `Export_${name.replace(/\s+/g, "_")}_${projectCode}`;

    setTimeout(function() {
        window.print();
        setTimeout(function() { document.title = originalTitle; }, 1000);
    }, 100);
}

/* ==========================================================
   INIT
========================================================== */
document.addEventListener("DOMContentLoaded", function() {
    refreshParticipants();
});
</script>

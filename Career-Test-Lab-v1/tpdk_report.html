<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Penalaran dan Daya Kritis — TalentScope</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--p:#2563eb;--pd:#1d4ed8;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f7f9fc;--soft:#eff6ff;--ok:#10b981;--warn:#d97706;--danger:#dc2626;--purple:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif}
.wrap{max-width:1080px;margin:28px auto 60px;padding:0 18px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}
.back:hover{color:var(--p)}
.badge-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--p);font-size:11px;font-weight:800;border:1px solid #dbeafe}

/* HEADER PESERTA / PROJECT / TANGGAL */
.participant-header{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:20px;display:flex;gap:32px;flex-wrap:wrap;align-items:center;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.participant-header .hdr-item{display:flex;align-items:center;gap:12px}
.participant-header .hdr-icon{width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-size:16px;font-weight:900;flex-shrink:0}
.participant-header .hdr-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;font-weight:800;margin-bottom:3px}
.participant-header .hdr-value{font-size:16px;font-weight:900;color:var(--ink)}

/* HERO IQ */
.hero-iq{background:linear-gradient(135deg,#0f4ccf,#2563eb 65%,#3b82f6);color:#fff;border-radius:24px;padding:32px 36px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;box-shadow:0 18px 45px rgba(37,99,235,.18);margin-bottom:20px;position:relative;overflow:hidden}
.hero-iq:after{content:'';position:absolute;width:340px;height:340px;right:-120px;top:-180px;border-radius:50%;background:rgba(255,255,255,.09)}
.iq-circle{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}
.iq-circle .iq-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#dbeafe;font-weight:800}
.iq-circle .iq-value{font-size:52px;font-weight:900;line-height:1;margin:4px 0}
.iq-circle .iq-cat{font-size:11px;font-weight:800;color:#dbeafe}
.hero-iq h1{margin:0 0 6px;font-size:24px;position:relative;z-index:1}
.hero-iq p{margin:0;color:#dbeafe;font-size:13px;line-height:1.7;max-width:600px;position:relative;z-index:1}
.hero-iq .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#dbeafe;position:relative;z-index:1}
.hero-iq .meta span{display:inline-flex;align-items:center;gap:5px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.card .ico{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-size:16px;margin-bottom:10px}
.card .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;font-weight:800}
.card .v{font-size:22px;font-weight:900;margin:3px 0}
.card .cat{font-size:11px;font-weight:800;color:var(--p)}
.card .bar{height:6px;background:#eef2f7;border-radius:99px;overflow:hidden;margin-top:10px}
.card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#60a5fa);border-radius:99px;transition:.4s}
.card .pct{font-size:10px;color:var(--muted);font-weight:700;margin-top:5px}

/* STRENGTH WEAKNESS */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.panel.strength h3 i{background:#ecfdf5;color:#059669}
.panel.weakness h3 i{background:#fef2f2;color:#dc2626}
.panel.rekomendasi h3 i{background:#eff6ff;color:#2563eb}
.panel ul{margin:0;padding-left:20px;font-size:13px;line-height:1.75;color:#334155}
.panel li{margin-bottom:8px}

/* DETAIL TABLE */
.detail-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.04);margin-bottom:20px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.detail-item{padding:8px;border-radius:8px;text-align:center;font-size:11px;font-weight:800;border:1px solid var(--line)}
.detail-item.correct{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.detail-item.wrong{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.detail-item.empty{background:#f8fafc;color:#94a3b8}
.detail-item .code{display:block;font-size:9px;font-weight:700;opacity:.7}

/* DISCLAIMER */
.disclaimer{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:16px 18px;font-size:12px;color:#92400e;line-height:1.7;display:flex;gap:10px}
.disclaimer i{font-size:16px;flex-shrink:0}

.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btn{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#334155;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:hover{filter:brightness(.96)}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.error-box{padding:24px;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;color:#b91c1c;font-size:13px}

@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .hero-iq{grid-template-columns:1fr;text-align:center;padding:26px 22px}
  .iq-circle{margin:0 auto}
  .participant-header{gap:16px}
}
</style>

<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>

<!-- SUPABASE CLIENT -->
<script src="js/config.js?v=9"></script>
<script src="js/supabase-client.js?v=7"></script>
</head>
<body>

<div class="wrap">
  <div class="header">
    <a class="back" href="participant-dashboard.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</a>
    <span class="badge-pill"><i class="fa-solid fa-brain"></i> Tes Penalaran dan Daya Kritis</span>
  </div>

  <div id="root">
    <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat hasil...</div>
  </div>
</div>

<script>
const p = new URLSearchParams(location.search);
const projectId = (p.get('projectId') || '').trim();
const participantId = (p.get('participantId') || '').trim();

// FIX: Handle null assessmentIndex
var assessmentIndexParam = p.get('assessmentIndex');
var assessmentIndex = (assessmentIndexParam === null || assessmentIndexParam === 'null' || assessmentIndexParam === '')
    ? 0
    : Number(assessmentIndexParam);
const assessmentId = (p.get('assessmentId') || '').trim();

function el(id){ return document.getElementById(id); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

async function loadResult() {
  // Prioritas 1: dari localStorage (hasil baru saja)
  const keys = [
    assessmentId ? `tpdk_result_v1_${projectId}_${participantId}_${assessmentId}` : null,
    `tpdk_result_v1_${projectId}_${participantId}_${assessmentIndex}`,
    `assessment_result_v3_${projectId}_${participantId}_${assessmentIndex}`,
  ].filter(Boolean);

  let data = null;
  for (const k of keys) {
    try {
      const raw = localStorage.getItem(k);
      if (raw) { data = JSON.parse(raw); break; }
    } catch(e){}
  }

  // Prioritas 2: dari Supabase
  if (!data) {
    try {
      const sb = window.supabaseClient || window.supabase;
      if (!sb) {
        console.error('[TPDK Report] Supabase client tidak tersedia');
        el('root').innerHTML = `<div class="error-box"><i class="fa-solid fa-circle-exclamation"></i> Supabase client tidak tersedia. Pastikan supabase-client.js dimuat.</div>`;
        return;
      }

      if (sb && projectId && participantId) {
        // ============================================================
        // FIX: Query dengan fallback
        // ============================================================
        let row = null;

        // 1. Coba exact match dengan assessment_index
        const { data: row1 } = await sb.from('tpdk_results')
          .select('*')
          .eq('project_id', projectId)
          .eq('participant_id', participantId)
          .eq('assessment_index', assessmentIndex)
          .maybeSingle();

        if (row1) {
          row = row1;
          console.log('[TPDK Report] ✅ Found with assessment_index:', assessmentIndex);
        } else {
          console.warn('[TPDK Report] ⚠️ assessment_index filter failed, fallback to latest');

          // 2. Fallback: ambil yang terbaru
          const { data: row2 } = await sb.from('tpdk_results')
            .select('*')
            .eq('project_id', projectId)
            .eq('participant_id', participantId)
            .order('submitted_at', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (row2) {
            row = row2;
            console.log('[TPDK Report] ✅ Found with fallback (latest)');
          } else {
            console.error('[TPDK Report] ❌ No result found at all');
          }
        }

        if (row) {
          // Query project name (untuk header)
          let projectName = '-';
          try {
            const { data: proj } = await sb.from('projects')
              .select('name, project_name')
              .eq('id', projectId)
              .maybeSingle();
            if (proj) {
              projectName = proj.name || proj.project_name || '-';
            }
          } catch (e) {
            console.warn('[TPDK Report] Project name query failed:', e);
          }

          // Bentuk ulang data
          data = {
            participantName: row.participant_name || '-',
            projectName: projectName,
            assessmentName: row.assessment_name || 'Tes Penalaran',
            scores: {
              raw: { verbal: row.raw_verbal, numerik: row.raw_numerik, spasial: row.raw_spasial, analisa: row.raw_analisa, total: row.raw_total },
              tScore: { verbal: row.t_verbal, numerik: row.t_numerik, spasial: row.t_spasial, analisa: row.t_analisa, total: row.t_total },
              kategori: { verbal: row.kategori_verbal, numerik: row.kategori_numerik, spasial: row.kategori_spasial, analisa: row.kategori_analisa },
              iq: { value: row.iq_estimate, category: row.iq_category, percentile: row.iq_percentile, description: row.iq_description },
              kelebihan: row.kelebihan || [],
              kelemahan: row.kelemahan || [],
              rekomendasi: row.rekomendasi || [],
              detail: row.detail_jawaban || [],
              disclaimer: row.disclaimer,
            },
            submittedAt: row.submitted_at,
          };
        }
      }
    } catch(e) {
      console.warn('[TPDK Report] Supabase fallback failed:', e);
    }
  }

  if (!data) {
    el('root').innerHTML = `<div class="error-box"><i class="fa-solid fa-circle-exclamation"></i> Hasil tidak ditemukan. Pastikan Anda telah menyelesaikan tes.</div>`;
    return;
  }

  render(data);
}

function render(data) {
  const s = data.scores || {};
  const iq = s.iq || {};
  const raw = s.raw || {};
  const tScore = s.tScore || {};
  const kat = s.kategori || {};

  // Subtest cards
  const subtestCards = [
    { code: 'A', name: 'Kemampuan Verbal', icon: 'fa-book-open', raw: raw.verbal, max: 20, t: tScore.verbal, cat: kat.verbal, pct: ((raw.verbal||0)/20*100) },
    { code: 'B', name: 'Kemampuan Numerik', icon: 'fa-calculator', raw: raw.numerik, max: 20, t: tScore.numerik, cat: kat.numerik, pct: ((raw.numerik||0)/20*100) },
    { code: 'C', name: 'Kemampuan Spasial', icon: 'fa-cube', raw: raw.spasial, max: 20, t: tScore.spasial, cat: kat.spasial, pct: ((raw.spasial||0)/20*100) },
    { code: 'D', name: 'Analisa & Sintesa', icon: 'fa-diagram-project', raw: raw.analisa, max: 10, t: tScore.analisa, cat: kat.analisa, pct: ((raw.analisa||0)/10*100) },
  ];

  const cardsHtml = subtestCards.map(c => `
    <div class="card">
      <div class="ico"><i class="fa-solid ${c.icon}"></i></div>
      <div class="k">${c.name}</div>
      <div class="v">${c.raw}<span style="font-size:13px;color:#94a3b8">/${c.max}</span></div>
      <div class="cat">${escapeHtml(c.cat||'-')}</div>
      <div class="bar"><i style="width:${c.pct}%"></i></div>
      <div class="pct">T-score: ${c.t} · ${c.pct.toFixed(0)}%</div>
    </div>
  `).join('');

  const kelebihan = (s.kelebihan || []).map(x => `<li>${escapeHtml(x)}</li>`).join('');
  const kelemahan = (s.kelemahan || []).map(x => `<li>${escapeHtml(x)}</li>`).join('');
  const rekomendasi = (s.rekomendasi || []).map(x => `<li>${escapeHtml(x)}</li>`).join('');

  const detail = (s.detail || []);
  const detailHtml = detail.length
    ? detail.map(d => {
        const cls = d.correct ? 'correct' : (d.selected ? 'wrong' : 'empty');
        return `<div class="detail-item ${cls}"><span class="code">${d.code}</span>${d.selected||'-'}</div>`;
      }).join('')
    : '<div style="color:#94a3b8;font-size:12px">Detail tidak tersedia.</div>';

  const submitted = data.submittedAt ? new Date(data.submittedAt).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }) : '-';

  // ============================================================
  // HEADER PESERTA / PROJECT / TANGGAL
  // ============================================================
  const participantInitial = String(data.participantName || 'P').charAt(0).toUpperCase();
  const assessmentDateShort = data.submittedAt 
    ? new Date(data.submittedAt).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) 
    : '-';

  const headerHtml = `
    <div class="participant-header">
      <div class="hdr-item">
        <div class="hdr-icon">${participantInitial}</div>
        <div>
          <div class="hdr-label">Participant</div>
          <div class="hdr-value">${escapeHtml(data.participantName || '-')}</div>
        </div>
      </div>
      <div class="hdr-item">
        <div class="hdr-icon"><i class="fa-solid fa-folder"></i></div>
        <div>
          <div class="hdr-label">Project</div>
          <div class="hdr-value">${escapeHtml(data.projectName || '-')}</div>
        </div>
      </div>
      <div class="hdr-item">
        <div class="hdr-icon"><i class="fa-solid fa-calendar"></i></div>
        <div>
          <div class="hdr-label">Assessment Date</div>
          <div class="hdr-value">${escapeHtml(assessmentDateShort)}</div>
        </div>
      </div>
    </div>
  `;

  el('root').innerHTML = `
    ${headerHtml}

    <div class="hero-iq">
      <div class="iq-circle">
        <div class="iq-label">IQ Estimasi</div>
        <div class="iq-value">${iq.value ?? '-'}</div>
        <div class="iq-cat">${escapeHtml(iq.category || '-')}</div>
      </div>
      <div>
        <h1>Kecerdasan Umum: ${escapeHtml(iq.category || '-')}</h1>
        <p>${escapeHtml(iq.description || '')}</p>
        <div class="meta">
          <span><i class="fa-solid fa-ranking-star"></i> Persentil ${iq.percentile ?? '-'}</span>
          <span><i class="fa-solid fa-hashtag"></i> Skor Total ${raw.total ?? '-'}/70</span>
          <span><i class="fa-solid fa-clock"></i> ${submitted}</span>
        </div>
      </div>
    </div>

    <div class="grid">${cardsHtml}</div>

    <div class="two-col">
      <div class="panel strength">
        <h3><i class="fa-solid fa-arrow-trend-up"></i> Kelebihan</h3>
        <ul>${kelebihan || '<li>-</li>'}</ul>
      </div>
      <div class="panel weakness">
        <h3><i class="fa-solid fa-arrow-trend-down"></i> Kelemahan</h3>
        <ul>${kelemahan || '<li>-</li>'}</ul>
      </div>
    </div>

    <div class="panel rekomendasi" style="margin-bottom:20px">
      <h3><i class="fa-solid fa-lightbulb"></i> Rekomendasi Pengembangan</h3>
      <ul>${rekomendasi || '<li>-</li>'}</ul>
    </div>

    <div class="detail-panel">
      <h3 style="margin:0 0 14px;font-size:15px"><i class="fa-solid fa-list-check" style="color:var(--p);margin-right:8px"></i> Detail Jawaban per Item</h3>
      <div style="display:flex;gap:14px;margin-bottom:12px;font-size:11px;font-weight:700;color:var(--muted);flex-wrap:wrap">
        <span><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;margin-right:5px"></span>Benar</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:2px;margin-right:5px"></span>Salah</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#cbd5e1;border-radius:2px;margin-right:5px"></span>Kosong</span>
      </div>
      <div class="detail-grid">${detailHtml}</div>
    </div>

    <div class="disclaimer">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div>${escapeHtml(s.disclaimer || 'IQ estimasi ini adalah estimasi berbasis tes penalaran khusus, BUKAN diagnosis IQ klinis.')}</div>
    </div>

    <div class="actions">
      <a class="btn" href="participant-dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <button class="btn primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Cetak Hasil</button>
    </div>
  `;
}

loadResult();
</script>
</body>
</html>

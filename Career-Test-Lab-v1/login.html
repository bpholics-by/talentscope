<script>
;(function () {
    "use strict";

    /* =====================================================
       FIX SUPABASE CLIENT ACCESS
       ===================================================== */

    const getSupabaseClient = function () {
        try {
            /* Jika window.supabase adalah client langsung */
            if (
                window.supabase &&
                typeof window.supabase.from === "function"
            ) {
                return window.supabase;
            }

            /* Jika client disimpan dengan nama lain */
            if (
                window.supabaseClient &&
                typeof window.supabaseClient.from === "function"
            ) {
                return window.supabaseClient;
            }

            if (
                window.sb &&
                typeof window.sb.from === "function"
            ) {
                return window.sb;
            }

            if (
                window.SUPABASE_CLIENT &&
                typeof window.SUPABASE_CLIENT.from === "function"
            ) {
                return window.SUPABASE_CLIENT;
            }

            return null;

        } catch (error) {
            console.error("❌ ERROR GET SUPABASE CLIENT:", error);
            return null;
        }
    };

    /* =====================================================
       TALENTSCOPE LOGIN - FULL FIX
       ===================================================== */

    /* =====================================================
       ELEMENT
    ===================================================== */

    const toggleBtn = document.getElementById("togglePassword");
    const passInput = document.getElementById("password");
    const loginForm = document.getElementById("loginForm");


    /* =====================================================
       PASSWORD SHOW / HIDE
    ===================================================== */

    if (toggleBtn && passInput) {
        toggleBtn.addEventListener("click", function () {
            const isPassword = passInput.type === "password";

            passInput.type = isPassword ? "text" : "password";

            toggleBtn.textContent = isPassword ? "Hide" : "Show";
        });
    }


    if (!loginForm) {
        console.error("❌ Login form tidak ditemukan.");
        return;
    }


    /* =====================================================
       HELPER NORMALIZE
    ===================================================== */

    function normalize(value) {
        return String(value || "")
            .trim()
            .toLowerCase();
    }


    /* =====================================================
       SAFE JSON PARSE
    ===================================================== */

    function safeJsonParse(value, fallback) {
        try {
            if (!value) return fallback;
            return JSON.parse(value);
        } catch (error) {
            return fallback;
        }
    }


    /* =====================================================
       UNIQUE ARRAY
    ===================================================== */

    function uniqueArray(array) {
        return [
            ...new Set(
                (array || [])
                    .filter(function (item) {
                        return item !== null &&
                            item !== undefined &&
                            String(item).trim() !== "";
                    })
                    .map(function (item) {
                        return String(item).trim();
                    })
            )
        ];
    }


    /* =====================================================
       CREATE SESSION ID
    ===================================================== */

    function createSessionId() {
        return "TS-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2, 12);
    }


    /* =====================================================
       CLEAR LOGIN SESSION ONLY
    ===================================================== */

    function clearLoginSessions() {
        try {
            sessionStorage.removeItem("ts_admin_session");
            sessionStorage.removeItem("ts_participant_session");
            sessionStorage.removeItem("participant_session");
            sessionStorage.removeItem("current_participant");
            sessionStorage.removeItem("currentParticipant");
        } catch (error) {
            console.warn(
                "⚠️ Gagal membersihkan login session:",
                error
            );
        }
    }


    /* =====================================================
       GET ASSESSMENT ID
    ===================================================== */

    function getAssessmentId(item) {

        if (!item) return "";

        return String(
            item.assessment_id ||
            item.assessmentId ||
            item.package_id ||
            item.packageId ||
            item.assessment_package_id ||
            item.assessment_package ||
            item.id ||
            ""
        ).trim();
    }


    /* =====================================================
       GET ASSESSMENT NAME
    ===================================================== */

    function getAssessmentName(item, index) {

        if (!item) {
            return "Assessment " + (index + 1);
        }

        return (
            item.assessment_name ||
            item.assessmentName ||
            item.package_name ||
            item.packageName ||
            item.name ||
            item.title ||
            item.assessment_title ||
            item.assessment_code ||
            item.code ||
            "Assessment " + (index + 1)
        );
    }


    /* =====================================================
       NORMALIZE ASSESSMENT
    ===================================================== */

    function normalizeAssessment(item, index, source) {

        if (!item) return null;

        const assessmentId = getAssessmentId(item);

        const assessmentCode =
            item.assessment_code ||
            item.assessmentCode ||
            item.package_code ||
            item.packageCode ||
            item.code ||
            item.type ||
            item.assessment_type ||
            "";

        const assessmentName =
            getAssessmentName(item, index);

        const status =
            item.status ||
            item.assignment_status ||
            item.progress_status ||
            "assigned";

        return {
            id: assessmentId || ("assessment_" + index),

            assessment_id:
                item.assessment_id ||
                assessmentId,

            assessmentId:
                item.assessment_id ||
                assessmentId,

            package_id:
                item.package_id ||
                "",

            packageId:
                item.package_id ||
                "",

            code: assessmentCode,

            assessment_code: assessmentCode,

            assessmentCode: assessmentCode,

            name: assessmentName,

            title: assessmentName,

            assessment_name: assessmentName,

            assessmentName: assessmentName,

            status: status,

            assignment_status: status,

            source:
                source ||
                "participant_assessments",

            project_id:
                item.project_id ||
                item.projectId ||
                "",

            participant_id:
                item.participant_id ||
                item.participantId ||
                "",

            raw: item
        };
    }


    /* =====================================================
       REMOVE DUPLICATE ASSESSMENTS
    ===================================================== */

    function removeDuplicateAssessments(assessments) {

        const result = [];
        const used = new Set();

        (assessments || []).forEach(function (item, index) {

            if (!item) return;

            const key = String(
                item.assessment_id ||
                item.assessmentId ||
                item.package_id ||
                item.packageId ||
                item.id ||
                item.code ||
                item.name ||
                index
            ).trim();

            if (key && !used.has(key)) {
                used.add(key);
                result.push(item);
            }
        });

        return result;
    }


    /* =====================================================
       EXTRACT ASSESSMENTS FROM PROJECT
    ===================================================== */

    function extractAssessmentsFromProject(project) {

        if (!project) return [];

        const possibleFields = [
            project.assessments,
            project.assessmentPackage,
            project.assessment_package,
            project.assessment_packages,
            project.packages,
            project.assessment_list,
            project.assessmentList
        ];

        for (let i = 0; i < possibleFields.length; i++) {

            const field = possibleFields[i];

            if (
                Array.isArray(field) &&
                field.length > 0
            ) {
                return field;
            }

            if (
                typeof field === "string" &&
                field.trim() !== ""
            ) {
                try {
                    const parsed = JSON.parse(field);

                    if (
                        Array.isArray(parsed) &&
                        parsed.length > 0
                    ) {
                        return parsed;
                    }
                } catch (error) {
                    /* ignore */
                }
            }
        }

        return [];
    }


    /* =====================================================
       FETCH ASSESSMENT DETAILS
       FIXED VERSION
    ===================================================== */

    async function fetchAssessmentDetails(assessmentIds) {

        const supabaseClient = getSupabaseClient();

if (!supabaseClient) {
    console.warn("⚠️ Supabase client tidak tersedia.");
    return [];
}

        const ids = uniqueArray(assessmentIds);

        if (ids.length === 0) {
            return [];
        }

        console.log(
            "🔍 FETCH ASSESSMENT DETAILS:",
            ids
        );

        const tableCandidates = [
            "assessments",
            "assessment_packages",
            "assessment_package",
            "packages"
        ];

        const idColumns = [
            "id",
            "assessment_id",
            "package_id"
        ];


        for (let t = 0; t < tableCandidates.length; t++) {

            const tableName =
                tableCandidates[t];

            for (let c = 0; c < idColumns.length; c++) {

                const columnName =
                    idColumns[c];

                try {

                    const {
                        data,
                        error
                    } = await supabaseClient
    .from(tableName)
                        .select("*")
                        .in(
                            columnName,
                            ids
                        );


                    if (error) {
                        console.log(
                            "ℹ️ Table/column tidak cocok:",
                            tableName,
                            columnName,
                            error.message
                        );

                        continue;
                    }


                    if (
                        Array.isArray(data) &&
                        data.length > 0
                    ) {

                        console.log(
                            "✅ Detail assessment ditemukan:",
                            tableName,
                            data
                        );

                        return data;
                    }

                } catch (error) {

                    console.log(
                        "ℹ️ Skip:",
                        tableName,
                        columnName
                    );

                }
            }
        }

        console.warn(
            "⚠️ Detail assessment tidak ditemukan."
        );

        return [];
    }


    /* =====================================================
   LOAD PARTICIPANT ASSESSMENTS
   UNIVERSAL SUPABASE VERSION
===================================================== */

async function loadParticipantAssessments(
    participant,
    project,
    projectId
) {

    const supabaseClient = getSupabaseClient();

    if (!supabaseClient) {

        console.error(
            "❌ SUPABASE CLIENT TIDAK TERSEDIA SAAT LOAD ASSESSMENT"
        );

        return [];
    }


    console.log("========================================");
    console.log("🔍 MEMULAI PENCARIAN ASSESSMENT");
    console.log("Participant ID:", participant.id);
    console.log("Project ID:", projectId);
    console.log("Project:", project);
    console.log("========================================");


    let finalAssessments = [];


    /* =====================================================
       HELPER QUERY TABLE
    ===================================================== */

    async function tryQuery(
        tableName,
        filters
    ) {

        try {

            let query =
                supabaseClient
                    .from(tableName)
                    .select("*");


            if (
                Array.isArray(filters)
            ) {

                filters.forEach(function (filter) {

                    if (
                        filter &&
                        filter.column &&
                        filter.value
                    ) {

                        query =
                            query.eq(
                                filter.column,
                                filter.value
                            );
                    }

                });

            }


            const {
                data,
                error
            } = await query;


            if (error) {

                console.log(
                    "ℹ️ TABLE SKIP:",
                    tableName,
                    error.message
                );

                return [];

            }


            console.log(
                "✅ TABLE FOUND:",
                tableName,
                "ROWS:",
                Array.isArray(data)
                    ? data.length
                    : 0
            );


            if (
                Array.isArray(data) &&
                data.length > 0
            ) {

                console.table(data);

            }


            return Array.isArray(data)
                ? data
                : [];

        } catch (error) {

            console.log(
                "ℹ️ TABLE ERROR:",
                tableName,
                error.message
            );

            return [];

        }

    }


    /* =====================================================
       STEP 1
       PARTICIPANT_ASSESSMENTS
    ===================================================== */

    console.log(
        "1️⃣ CEK participant_assessments"
    );


    let assignmentData =
        await tryQuery(
            "participant_assessments",
            [
                {
                    column: "participant_id",
                    value: participant.id
                }
            ]
        );


    if (
        assignmentData.length > 0 &&
        projectId
    ) {

        const projectFiltered =
            assignmentData.filter(
                function (item) {

                    const itemProjectId =
                        item.project_id ||
                        item.projectId ||
                        "";

                    if (!itemProjectId) {
                        return true;
                    }

                    return String(
                        itemProjectId
                    ).trim() ===
                    String(
                        projectId
                    ).trim();

                }
            );


        if (
            projectFiltered.length > 0
        ) {

            assignmentData =
                projectFiltered;

        }

    }


    if (
        assignmentData.length > 0
    ) {

        console.log(
            "✅ ASSESSMENT DITEMUKAN DARI participant_assessments"
        );


        finalAssessments =
            assignmentData
                .map(
                    function (
                        item,
                        index
                    ) {

                        return normalizeAssessment(
                            item,
                            index,
                            "participant_assessments"
                        );

                    }
                )
                .filter(Boolean);

    }


    /* =====================================================
       STEP 2
       PROJECT FIELDS
    ===================================================== */

    if (
        finalAssessments.length === 0 &&
        project
    ) {

        console.log(
            "2️⃣ CEK ASSESSMENT DI PROJECT"
        );


        const projectAssessments =
            extractAssessmentsFromProject(
                project
            );


        if (
            projectAssessments.length > 0
        ) {

            console.log(
                "✅ ASSESSMENT DITEMUKAN DI PROJECT:",

            );


            finalAssessments =
                projectAssessments
                    .map(
                        function (
                            item,
                            index
                        ) {

                            return normalizeAssessment(
                                item,
                                index,
                                "project"
                            );

                        }
                    )
                    .filter(Boolean);

        }

    }

       STEP 3
       PROJECT_ASSESSMENTS
    ===================================================== */

    if (

    ) {

        );


        const projectAssignments =
            await tryQuery(
                "project_assessments",
                [
                    {
                        column: "project_id",
                        value: projectId
                    }
                ]
            );


        if (
            projectAssignments.length > 0
        ) {

            console.log(
                "✅ DATA DITEMUKAN DI project_assessments"
            );

                projectAssignments
                    .map(
                        function (
                            item,
                            index
                        ) {

                            return normalizeAssessment(
                                item,
                                index,
                                "project_assessments"
                            );

                        }
                    )
                    .filter(Boolean);

        }

    }


    /* =====================================================
       STEP 4
       PROJECT_PACKAGES
    ===================================================== */

    if (
        finalAssessments.length === 0 &&
        projectId
    ) {

        console.log(
            "4️⃣ CEK project_packages"
        );


        const projectPackages =
            await tryQuery(
                "project_packages",
                [
                    {
                        column: "project_id",
                        value: projectId
                    }
                ]
            );


        if (
            projectPackages.length > 0
        ) {

            console.log(
                "✅ DATA DITEMUKAN DI project_packages"
            );

                    .map(
                        function (
                            item,
                            index
                        ) {

                            return normalizeAssessment(
                                item,
                                index,
                                "project_packages"
                            );

                        }
                    )
                    .filter(Boolean);

        }

    }


    /* =====================================================
       STEP 5
       ASSESSMENT_PACKAGES BY PROJECT
    ===================================================== */

    if (
        finalAssessments.length === 0 &&

        console.log(
            "5️⃣ CEK assessment_packages"

            await tryQuery(

                    {
                        column: "project_id",

                await tryQuery(

                    []

                    .map(

                            );

                    .filter(Boolean);

       GET ASSESSMENT DETAILS FROM ASSIGNMENTS
    ===================================================== */

        finalAssessments.length === 0 &&
        assignmentData.length > 0

        console.log(
            "6️⃣ MENGAMBIL DETAIL ASSESSMENT"

                assignmentData.map(

                        );

                    }
                )
            );


        if (

                            ) {

                                return normalizeAssessment(
                                    item,
                                    index,

                                );

                            }
                        )
                        .filter(Boolean);

            }

        }

    }


    /* =====================================================

    ===================================================== */

    finalAssessments =
        removeDuplicateAssessments(

    /* =====================================================
       FIND PARTICIPANT
       MULTI IDENTIFIER
    ===================================================== */

    function findParticipant(
        participantList,
        userIn
    ) {

        return participantList.find(
            function (participant) {

                const identifiers = [

                    participant.email,

                    participant.username,

                    participant.participant_code,

                    participant.employee_id,

                    participant.id,

                    participant.name,

                    participant.full_name

                ];


                return identifiers.some(
                    function (value) {

                        if (
                            value === null ||
                            value === undefined
                        ) {
                            return false;
                        }

                        return (
                            normalize(value) === userIn
                        );
                    }
                );

            }
        );
    }


    /* =====================================================
       VALIDATE PARTICIPANT PASSWORD
    ===================================================== */

    function validateParticipantPassword(
        participant,
        passIn
    ) {

        const possiblePasswords = [

            participant.password,

            participant.access_code,

            participant.password_text,

            participant.login_password,

            participant.participant_password,

            participant.pass,

            participant.accessCode

        ];


        console.log(
            "🔐 PASSWORD FIELDS CHECK:",
            possiblePasswords.map(
                function (password) {

                    if (
                        password === null ||
                        password === undefined ||
                        password === ""
                    ) {
                        return "[EMPTY]";
                    }

                    return "[SET]";
                }
            )
        );


        return possiblePasswords.some(
            function (password) {

                if (
                    password === null ||
                    password === undefined
                ) {
                    return false;
                }

                return (
                    String(password).trim() ===
                    String(passIn).trim()
                );

            }
        );
    }

<script src="js/app.js"></script>


<script>
(function () {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const projectId = String(params.get("projectId") || "").trim();
  const participantId = String(params.get("participantId") || "").trim();

  const $ = (id) => document.getElementById(id);
  const safe = (value, fallback = "-") => {
    const v = value == null ? "" : String(value).trim();
    return v ? v : fallback;
  };

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
  }

  function getProjects() {
    try {
      const raw = localStorage.getItem("talentscope_projects") || "[]";
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error("Gagal membaca talentscope_projects:", e);
      return [];
    }
  }

  function getProject() {
    const projects = getProjects();
    return projects.find((p) => {
      const id = p && (p.id || p.projectId || p.project_id || "");
      return String(id) === projectId;
    }) || null;
  }

  function getParticipant(project) {
    if (!project) return null;
    const participants = Array.isArray(project.participants)
      ? project.participants
      : [];

    return participants.find((p) => {
      const id = p && (p.id || p.participantId || p.employeeId || p.employee_id || "");
      return String(id) === participantId;
    }) || null;
  }

  function getAssessmentName(item, index) {
    if (typeof item === "string") return safe(item, `Assessment ${index + 1}`);
    if (!item || typeof item !== "object") return `Assessment ${index + 1}`;
    return safe(
      item.name ||
      item.title ||
      item.assessmentName ||
      item.testName ||
      item.label ||
      item.code,
      `Assessment ${index + 1}`
    );
  }

  function getAssessments(project) {
    const source = Array.isArray(project?.assessments)
      ? project.assessments
      : Array.isArray(project?.assessment)
        ? project.assessment
        : [];

    return source.map((item, index) => ({
      raw: item,
      index,
      name: getAssessmentName(item, index),
      code:
        typeof item === "object" && item
          ? safe(item.code || item.id || item.assessmentId || item.testId, "")
          : ""
    }));
  }

  function formatDate(value) {
    if (!value || value === "-") return "-";
    const raw = String(value);
    const date = new Date(/^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw + "T00:00:00" : raw);
    if (Number.isNaN(date.getTime())) return raw;
    return new Intl.DateTimeFormat("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }).format(date);
  }

  function iconFor(name) {
    const s = String(name || "").toLowerCase();
    if (/disc|papi|personality|behavior|behavioral|big five|16pf|epps|rmib/.test(s)) return "fa-brain";
    if (/verbal/.test(s)) return "fa-file-lines";
    if (/numeric|numerical|kraepelin|pauli/.test(s)) return "fa-calculator";
    if (/abstract|spatial|intelligence|cfit|ist/.test(s)) return "fa-shapes";
    if (/visual|attention|matching|speed|performance/.test(s)) return "fa-eye";
    if (/situational|judgement|sjt/.test(s)) return "fa-list-check";
    return "fa-clipboard-check";
  }

  function renderSection(test) {
    const iframeSrc =
      "test-result.html" +
      "?projectId=" + encodeURIComponent(projectId) +
      "&participantId=" + encodeURIComponent(participantId) +
      "&assessmentIndex=" + encodeURIComponent(test.index);

    return `
      <section class="combined-section" id="combined-test-${test.index}">
        <div class="combined-section-head">
          <div class="combined-section-title">
            <div class="report-item-icon">
              <i class="fa-solid ${iconFor(test.name)}"></i>
            </div>
            <div>
              <h3>${esc(test.name)}</h3>
              <small>${test.code ? esc(test.code) : "Assessment Result"}</small>
            </div>
          </div>
          <div class="combined-section-badge">${esc(test.index + 1)}</div>
        </div>
        <div class="combined-frame-wrap">
          <div class="combined-frame-loading" id="frame-loading-${test.index}">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Memuat hasil ${esc(test.name)}…
          </div>
          <iframe
            class="combined-frame"
            id="result-frame-${test.index}"
            title="Hasil ${esc(test.name)}"
            src="${esc(iframeSrc)}"
            loading="eager"
            data-assessment-index="${test.index}">
          </iframe>
        </div>
      </section>
    `;
  }

  function resizeFrame(frame) {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      const body = doc.body;
      const root = doc.documentElement;

      // Paksa dokumen hasil tidak membuat scrollbar internal.
      if (root) {
        root.style.setProperty("overflow", "visible", "important");
        root.style.setProperty("height", "auto", "important");
        root.style.setProperty("min-height", "0", "important");
      }
      if (body) {
        body.style.setProperty("overflow", "visible", "important");
        body.style.setProperty("height", "auto", "important");
        body.style.setProperty("min-height", "0", "important");
        body.style.setProperty("margin", "0", "important");
        body.style.setProperty("padding-bottom", "0", "important");
      }

      // Hilangkan sumber ruang kosong dari layout halaman hasil asli.
      if (doc.head && !doc.getElementById("__combined_compact_style")) {
        const style = doc.createElement("style");
        style.id = "__combined_compact_style";
        style.textContent = `
          html, body, .app, .main, .content {
            min-height: 0 !important;
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
          }
          body { margin: 0 !important; padding-bottom: 0 !important; }
          .app, .main, .content { margin-bottom: 0 !important; }
          script, style, link, meta, title { display:none !important; }
        `;
        doc.head.appendChild(style);
      }

      requestAnimationFrame(() => {
        let measured = 0;

        // Ukur batas bawah konten yang benar-benar terlihat, bukan tinggi
        // container yang mungkin memiliki min-height 100vh / layout kosong.
        if (body) {
          Array.from(body.children).forEach((node) => {
            const tag = node.tagName;
            if (/SCRIPT|STYLE|LINK|META|TITLE/.test(tag)) return;
            const rect = node.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              measured = Math.max(measured, rect.bottom);
            }
          });

          // Fallback ke elemen konten terbesar bila wrapper body tidak cukup.
          if (!measured) {
            const candidates = Array.from(doc.querySelectorAll("main, section, article, .result-card, .content, .card"));
            candidates.forEach((node) => {
              const rect = node.getBoundingClientRect();
              if (rect.width > 0 && rect.height > 0) measured = Math.max(measured, rect.bottom);
            });
          }
        }

        if (!measured) {
          measured = Math.max(
            body ? body.scrollHeight : 0,
            root ? root.scrollHeight : 0,
            120
          );
        }

        frame.style.height = Math.max(120, Math.ceil(measured + 6)) + "px";
      });
    } catch (e) {
      // Fallback kecil; sama-origin seharusnya memungkinkan pengukuran penuh.
      frame.style.height = "500px";
    }
  }

  function bindFrames() {
    document.querySelectorAll(".combined-frame").forEach((frame) => {
      const onLoad = () => {
        const loading = $("frame-loading-" + frame.dataset.assessmentIndex);
        if (loading) loading.style.display = "none";
        resizeFrame(frame);
        [150, 400, 800, 1500].forEach(ms => setTimeout(() => resizeFrame(frame), ms));

        // Observasi perubahan ukuran konten hasil agar iframe selalu mengikuti tinggi sebenarnya.
        try {
          const doc = frame.contentDocument;
          if (doc && window.ResizeObserver) {
            const ro = new ResizeObserver(() => resizeFrame(frame));
            ro.observe(doc.body || doc.documentElement);
            frame._combinedResizeObserver = ro;
          }
        } catch (e) {}
      };
      frame.addEventListener("load", onLoad);
    });
  }

  function render() {
    if (!projectId || !participantId) {
      $("combinedReportsList").innerHTML = `
        <div class="combined-error">
          <strong>Data project atau peserta tidak lengkap.</strong><br>
          Halaman Combined Result membutuhkan <code>projectId</code> dan <code>participantId</code>.
        </div>`;
      return;
    }

    const project = getProject();
    const participant = getParticipant(project);

    if (!project) {
      $("combinedReportsList").innerHTML = `
        <div class="combined-error">
          <strong>Project tidak ditemukan.</strong><br>
          Tidak ada project dengan ID <code>${esc(projectId)}</code> pada data aplikasi.
        </div>`;
      return;
    }

    if (!participant) {
      $("combinedReportsList").innerHTML = `
        <div class="combined-error">
          <strong>Peserta tidak ditemukan.</strong><br>
          Tidak ada peserta dengan ID <code>${esc(participantId)}</code> pada project ini.
        </div>`;
      return;
    }

    $("participantName").textContent = safe(
      participant.name ||
      participant.fullName ||
      participant.participantName,
      "-"
    );

    $("projectName").textContent = safe(
      project.projectName ||
      project.name ||
      project.project ||
      project.title,
      "-"
    );

    $("assessmentDate").textContent = formatDate(
      participant.assessmentDate ||
      participant.assessment_date ||
      project.assessmentDate ||
      project.assessment_date ||
      project.startDate ||
      project.start
    );

    const tests = getAssessments(project);
    const list = $("combinedReportsList");
    const detail = $("combinedDetail");

    if (!tests.length) {
      list.innerHTML = `
        <div class="combined-error">
          <strong>Paket assessment kosong.</strong><br>
          Tidak ada assessment yang tersimpan pada project ini.
        </div>`;
      detail.innerHTML = "";
      return;
    }

    // Langsung tampilkan hasil tes sesuai urutan yang tersimpan di project.assessments.
    detail.innerHTML = tests.map(renderSection).join("");
    bindFrames();
  }

  window.addEventListener("DOMContentLoaded", render);

  // Sinkronkan ketika data project/results berubah dari tab lain.
  window.addEventListener("storage", (event) => {
    if (event.key === "talentscope_projects") {
      render();
      bindFrames();
    }
  });
})();
</script>
</script>

<script src="js/combined-result.js"></script>

</body>

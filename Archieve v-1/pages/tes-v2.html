<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Assessment - Career Test Lab</title>

    <link
        rel="stylesheet"
        href="../css/tes-v2.css">

</head>

<body>

<div class="test-page">

    <!-- HEADER -->

    <header class="test-header">

        <div>

            <div class="brand">
                CAREER TEST LAB
            </div>

            <h1 id="testTitle">
                Tes
            </h1>

        </div>


        <div class="timer-box">

            <span class="timer-label">
                Sisa Waktu
            </span>

            <strong id="timer">
                00:00
            </strong>

        </div>

    </header>


    <!-- PROGRESS -->

    <div class="progress-wrapper">

        <div class="progress-info">

            <span id="sectionTitle">
                Bagian Tes
            </span>

            <span id="questionProgress">
                Soal 1 dari 1
            </span>

        </div>

        <div class="progress-bar">

            <div
                id="progress"
                class="progress-fill">
            </div>

        </div>

    </div>


    <!-- MAIN -->

    <main class="test-content">


        <!-- SECTION NAVIGATION -->

        <div
            id="sectionNavigation"
            class="section-navigation">
        </div>


        <!-- QUESTION CARD -->

        <section class="question-card">


            <div class="question-number">

                Soal
                <span id="questionNumber">
                    1
                </span>

            </div>


            <div
                id="questionText"
                class="question-text">

                Memuat soal...

            </div>


            <div
                id="options"
                class="options">
            </div>


        </section>


        <!-- NAVIGATION -->

        <div class="question-navigation">

            <button
                id="previousBtn"
                class="nav-btn secondary">

                ← Sebelumnya

            </button>


            <button
                id="nextBtn"
                class="nav-btn primary">

                Berikutnya →

            </button>

        </div>


    </main>


    <!-- MODAL SELESAI -->

    <div
        id="finishModal"
        class="modal hidden">

        <div class="modal-card">

            <h2>
                Selesaikan Tes?
            </h2>

            <p>

                Pastikan Anda telah menjawab
                seluruh soal yang dapat dikerjakan.

            </p>


            <div class="modal-actions">

                <button
                    id="cancelFinish"
                    class="nav-btn secondary">

                    Kembali

                </button>


                <button
                    id="confirmFinish"
                    class="nav-btn primary">

                    Selesaikan Tes

                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/test/test-config.js"></script>

<script src="../js/test/engine-v2.js"></script>

</body>

</html>

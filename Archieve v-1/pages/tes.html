<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Career Test Lab</title>

<link rel="stylesheet"
href="../css/tes.css">

</head>

<body>

<div class="test-layout">

    <!-- Header -->

    <header class="header">

        <div>

            <h2>Career Test Lab</h2>

            <span id="namaPeserta"></span>

        </div>

        <div class="timer-box">

            ⏰ <span id="timer">10:00</span>

        </div>

    </header>

    <!-- Main -->

    <main class="main-content">

        <!-- Soal -->

        <section class="question-area">

            <div class="progress-container">

                <div id="progressBar"></div>

            </div>

            <div class="info">

                <span id="jenisTes">Tes Verbal</span>

                <span id="nomorSoal">1 / 40</span>

            </div>

            <div class="card">

                <h2 id="questionText">

                    Pertanyaan akan muncul di sini

                </h2>

                <div id="options"></div>

            </div>

            <div class="navigation">

                <button id="prevBtn">

                    ← Sebelumnya

                </button>

                <button id="nextBtn">

                    Berikutnya →

                </button>

            </div>

        </section>

        <!-- Nomor Soal -->

        <aside class="sidebar">

            <h3>Daftar Soal</h3>

            <div id="questionGrid"></div>

        </aside>

    </main>

</div>

<script src="../js/config.js"></script>
<script src="../js/helper.js"></script>
<script src="../js/storage.js"></script>

<script src="../data/verbal.js"></script>

<script src="../js/test/timer.js"></script>
<script src="../js/test/engine.js"></script>

</body>

</html>
